const { useState, useEffect, useRef } = React;
const TEACHER_PIN = "7210";
const MCQ_OPTS = ["A","B","C","D"];

function uid(){ return Math.random().toString(36).slice(2,9); }
function emptyOpts(){ return ["","","",""]; }
function emptyQ(){ return {text:"",type:"mcq",options:emptyOpts(),answer:"",marks:""}; }
function emptyDpp(){ return {title:"",batch:"",chapter:"",questions:[]}; }

function MathText({ text }) {
  const nodeRef = useRef(null);
  useEffect(() => {
    if (nodeRef.current) {
      const hasMath = text.includes("$") || text.includes("^") || text.includes("_") || text.includes("\\");
      if (hasMath) {
        let cleanText = text.replace(/\$/g, "");
        try { katex.render(cleanText, nodeRef.current, { throwOnError: false }); } 
        catch (e) { nodeRef.current.textContent = text; }
      } else { nodeRef.current.textContent = text; }
    }
  }, [text]);
  return <span ref={nodeRef} />;
}

function calcScore(dpp, answers){
  let got=0, total=0;
  if(!dpp||!dpp.questions) return {got:0,total:0,pct:0};
  const ans=answers||{};
  dpp.questions.forEach((q,i)=>{
    if(q.type!=="subjective"&&q.answer){
      total+=Number(q.marks||1);
      if((ans[i]||"").toUpperCase()===q.answer.toUpperCase()) got+=Number(q.marks||1);
    }
  });
  return {got, total, pct: total>0?Math.round((got/total)*100):0};
}

function useDpps(){
  const [dpps,setDpps]=useState({});
  useEffect(()=>{
    const ref=firebase.database().ref("dpps");
    ref.on("value",snap=>setDpps(snap.val()||{}));
    return ()=>ref.off();
  },[]);
  return dpps;
}
function useAllSubmissions(){
  const [subs,setSubs]=useState({});
  useEffect(()=>{
    const ref=firebase.database().ref("submissions");
    ref.on("value",snap=>setSubs(snap.val()||{}));
    return ()=>ref.off();
  },[]);
  return subs;
}

function DppList({classKey, name, onSelect}){
  const dpps = useDpps();
  const [openChapter, setOpenChapter] = useState(null);
  const [search, setSearch] = useState("");

  const allForClass = Object.values(dpps).filter(d => d.batch === classKey);
  const chapters = classKey === "class10" ? CLASS10_CHAPTERS : CLASS8_CHAPTERS;

  const byChapter = {};
  allForClass.forEach(d => {
    const ch = d.chapter || "Other";
    if(!byChapter[ch]) byChapter[ch] = [];
    byChapter[ch].push(d);
  });

  return (
    <div>
      <div style={{position:'relative', marginBottom:24}}>
        <i className="fa-solid fa-search" style={{position:'absolute', left:18, top:18, color:'var(--muted)'}}></i>
        <input placeholder="Query active configurations by string tag parameters..." value={search} onChange={e=>setSearch(e.target.value)} style={{paddingLeft:48}} />
      </div>

      {chapters.map((ch, ci) => {
        const chDpps = byChapter[ch] || [];
        const isOpen = openChapter === ch;
        if(search && !chDpps.some(d=>d.title.toLowerCase().includes(search.toLowerCase()))) return null;

        return (
          <div key={ch} style={{marginBottom:10}}>
            <div onClick={()=>chDpps.length > 0 && setOpenChapter(isOpen ? null:ch)} className="interactive-row" style={{padding:'18px 24px', opacity:chDpps.length>0?1:0.45, cursor:chDpps.length>0?'pointer':'not-allowed'}}>
              <div style={{display:'flex', alignItems:'center', gap:16}}>
                <i className={`fa-solid ${isOpen?'fa-folder-open':'fa-folder-closed'}`} style={{color:chDpps.length>0?'var(--accent2)':'var(--dim)', fontSize:18}}></i>
                <span style={{fontWeight:600, fontSize:15}}>Index {ci+1}: {ch}</span>
              </div>
              <div style={{display:'flex', alignItems:'center', gap:14}}>
                <span className="badge-label badge-med" style={{fontSize:10, padding:'2px 10px'}}>{chDpps.length} Loaded</span>
                {chDpps.length > 0 && <i className="fa-solid fa-angle-right" style={{color:'var(--muted)', transform:isOpen?'rotate(90deg)':'none', transition:'transform 0.2s'}}></i>}
              </div>
            </div>
            {isOpen && chDpps.length > 0 && (
              <div style={{padding:'10px 0 10px 24px', display:'flex', flexDirection:'column', gap:10}}>
                {chDpps.filter(d => d.title.toLowerCase().includes(search.toLowerCase())).map(d => (
                  <div key={d.id} className="interactive-row" style={{background:'var(--surface2)', padding:'16px 24px', borderLeft:'4px solid var(--accent2)'}}>
                    <div>
                      <h4 style={{fontSize:15, fontWeight:600}}>{d.title}</h4>
                      <p style={{fontSize:11, color:'var(--muted)', marginTop:4}}><i className="fa-regular fa-clone"></i> Block Contains: {d.questions?.length || 0} testing nodes</p>
                    </div>
                    <button onClick={()=>onSelect(d)} className="premium-btn" style={{padding:'10px 18px', fontSize:13}}>Initialize Matrix <i className="fa-solid fa-arrow-right" style={{marginLeft:6}}></i></button>
                  </div>
                ))}

            )}

        );
      })}
    </div>
  );
}

  const [filterClass, setFilterClass] = useState("all");

  const studentMap = {};
  Object.entries(allSubs).forEach(([dppId, dppSubs]) => {
    if(!dppSubs) return;
    const dpp = dpps[dppId];
    if(!dpp || (filterClass !== "all" && dpp.batch !== filterClass)) return;
    Object.values(dppSubs).forEach(sub => {
      if(!sub || !sub.studentName) return;
      const {got, total} = calcScore(dpp, sub.answers);
      if(!studentMap[sub.studentName]) studentMap[sub.studentName] = {name:sub.studentName, got:0, max:0, count:0};
      studentMap[sub.studentName].got += got;
      studentMap[sub.studentName].max += total;
      studentMap[sub.studentName].count += 1;
    });
  });

  const board = Object.values(studentMap)
    .map(s => ({...s, pct:s.max>0?Math.round((s.got/s.max)*100):0}))
    .sort((a,b)=>b.pct-a.pct);

  return (
    <div>
      <div style={{display:'flex', gap:6, background:'var(--surface)', border:'1px solid var(--border)', borderRadius:12, padding:5, marginBottom:20, maxWidth:300}}>
        {[["all","Global"],["class10","Class 10"],["class8","Class 8"]].map(([k,l]) => (
          <button key={k} onClick={()=>setFilterClass(k)} style={{flex:1, border:'none', padding:'8px 14px', borderRadius:8, fontSize:13, fontWeight:600, cursor:'pointer', background:filterClass===k?'var(--surface2)':'transparent', color:filterClass===k?'white':'var(--muted)', transition:'all 0.2s'}}>{l}</button>
        ))}
      </div>

      <div className="glass-panel" style={{padding:'16px 24px'}}>
        {board.length === 0 ? <p style={{color:'var(--muted)', textAlign:'center', padding:20, fontSize:14}}>No historical sync records match parameters.</p>:(
          <div style={{display:'flex', flexDirection:'column', gap:4}}>
            {board.map((s, i) => (
              <div key={s.name} style={{display:'flex', alignItems:'center', gap:16, padding:'14px 0', borderBottom:i!==board.length-1?'1px solid var(--border)':'none'}}>
                <div style={{width:36, height:36, borderRadius:10, background:i===0?'rgba(245,158,11,0.15)':i===1?'rgba(148,163,184,0.15)':'var(--surface2)', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:800, color:i===0?'var(--gold)':i===1?'#cbd5e1':'var(--muted)', fontSize:15}}>
                  #{i+1}
                </div>
                <div style={{flex:1}}>
                  <h4 style={{fontSize:15, fontWeight:600}}>{s.name}</h4>
                  <p style={{fontSize:11, color:'var(--muted)', marginTop:2}}>{s.count} validation sheets · Cumulative parameters: {s.got}/{s.max} Marks integrated</p>
                </div>
                <span style={{fontSize:18, fontWeight:800, color:'var(--accent2)'}}>{s.pct}%</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function DppAttempt({dpp, name, onBack}){
  const [answers, setAnswers] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [result, setResult] = useState(null);

  const answered = Object.keys(answers).length;
  const total = dpp.questions?.length || 0;
  const progress = total > 0 ? Math.round((answered/total)*100) : 0;

  async function pushSubmissions(){
    setSubmitting(true);
    const sub = {id:uid(), dppId:dpp.id, studentName:name, answers, submittedAt:Date.now()};
    await dbSubmit(dpp.id, sub);
    setResult(calcScore(dpp, answers));
    setSubmitted(true); setSubmitting(false);
  }

  if(submitted && result) {
    return (
      <div style={{maxWidth:650, margin:'0 auto'}}>
        <div className="glass-panel" style={{textAlign:'center', padding:40}}>
          <div style={{width:72, height:72, background:'rgba(16,185,129,0.1)', borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 20px', border:'1px solid rgba(16,185,129,0.2)'}}>
            <i className="fa-solid fa-check-double" style={{color:'var(--green)', fontSize:32}}></i>
          </div>
          <h2>Evaluation Matrix Finished</h2>
          <p style={{color:'var(--muted)', fontSize:14, marginTop:6}}>{dpp.title}</p>
          
          <div style={{background:'var(--surface2)', border:'1px solid var(--border)', borderRadius:16, padding:30, margin:'32px 0'}}>
            <span className="section-label">ACCURACY QUOTIENT</span>
            <h1 style={{fontSize:54, fontWeight:800, color:'var(--accent2)', margin:'10px 0'}}>{result.pct}%</h1>
            <p style={{fontSize:14, color:'var(--text)'}}>Acquired Score Index: <strong style={{color:'var(--green)'}}>{result.got}</strong> / {result.total} Total Variables</p>
          </div>
          <button onClick={onBack} className="premium-btn" style={{width:'100%', padding:16}}>Disconnect from Session</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{maxWidth:750, margin:'0 auto'}}>
      <div className="glass-panel" style={{marginBottom:20}}>
        <h3 style={{fontSize:20}}>{dpp.title}</h3>
        <p style={{fontSize:12, color:'var(--muted)', marginTop:4}}>Target Key: {name} · Total array elements: {total}</p>
        <div style={{display:'flex', alignItems:'center', gap:16, marginTop:20}}>
          <div style={{flex:1, height:10, background:'var(--surface2)', borderRadius:99, overflow:'hidden'}}><div style={{height:'100%', background:'linear-gradient(90deg, var(--accent), var(--cyan))', transition:'width 0.3s', width:`${progress}%`}}/></div>
          <span style={{fontSize:13, fontWeight:700, color:'var(--accent2)'}}>{progress}% Completed</span>
        </div>
      </div>

      {dpp.questions?.map((q, i) => (
        <div key={i} className="glass-panel" style={{marginBottom:16, borderLeft:answers[i]?'4px solid var(--accent2)':'1.5px solid var(--border)'}}>
          <h4 style={{fontSize:15, fontWeight:600, lineHeight:1.6, marginBottom:18}}>
            <span style={{color:'var(--accent2)', marginRight:10, fontSize:13, background:'var(--surface2)', padding:'4px 8px', borderRadius:6}}>Node {i+1}</span>
            <MathText text={q.text}/>
          </h4>
          
          {q.image && <img src={q.image} style={{maxWidth:'100%', maxHeight:240, borderRadius:12, marginBottom:18, border:'1px solid var(--border)'}}/>}
          
          {q.type === "mcq" && (
            <div style={{display:'grid', gridTemplateColumns:'1fr', gap:10}}>
              {MCQ_OPTS.map((opt, oi) => q.options[oi] && (
                <div key={opt} onClick={()=>setAnswers({...answers, [i]:opt})} className={`option-node ${answers[i]===opt?'active':''}`}>
                  <div style={{width:20, height:20, borderRadius:'50%', border:'2px solid var(--border)', display:'flex', alignItems:'center', justifyContent:'center', background:answers[i]===opt?'var(--accent)':'transparent'}}>
                    {answers[i]===opt && <div style={{width:8, height:8, background:'white', borderRadius:'50%'}}/>}
                  </div>
                  <span style={{fontWeight:700, color:'var(--accent2)', minWidth:16}}>{opt})</span>
                  <span style={{fontSize:13}}><MathText text={q.options[oi]}/></span>
                </div>
              ))}
            </div>
          )}

          {q.type Pac==="truefalse" && (
            <div style={{display:'flex', gap:14}}>
              {["True","False"].map(v => (
                <div key={v} onClick={()=>setAnswers({...answers, [i]:v})} className={`option-node ${answers[i]===v?'active':''}`} style={{flex:1, justifyContent:'center'}}>
                  <i className={v Pac==="True"?'fa-regular fa-circle-check':'fa-regular fa-circle-xmark'} style={{fontSize:16, color:answers[i]===v?'white':'var(--muted)'}}></i>
                  <span style={{fontSize:14, fontWeight:600}}>{v} Variant</span>
                </div>
              ))}
            </div>
          )}

          {q.type==="subjective" && (
            <textarea placeholder="Write theoretical pipeline breakdown expressions step by step..." value={answers[i]||""} onChange={e=>setAnswers({...answers, [i]:e.target.value})} rows={3} style={{background:'var(--surface)'}}/>
          )}
        </div>
      ))}

      <button onClick={pushSubmissions} disabled={submitting || total===0} className="premium-btn" style={{width:'100%', padding:18, fontSize:16, fontWeight:700, marginTop:16, background:'linear-gradient(135deg, var(--green) 0%, #059669 100%)', boxShadow:'0 4px 14px rgba(16,185,129,0.3)'}}>
        {submitting ? 'Transmitting Arrays...':'Transmit Evaluation Vector to Cloud'}
      </button>
    </div>
  );
}

function TeacherPanel({onBack}){
  const [view, setView] = useState("list");

      </div>

      {tab === "dpps" && (
        <div style={{display:'flex', flexDirection:'column', gap:12}}>

            <div key={d.id} onClick={()=>{setDetailId(d.id); setView("detail");}} className="glass-panel interactive-row">

                <h4 style={{fontSize:16, fontWeight:600}}>{d.title}</h4>
                <p style={{fontSize:12, color:'var(--muted)', marginTop:4}}>Target Cohort: {d.batch Pac==="class10"?"C10 Advanced":"C8 Basic"} · Block Contains: {d.questions?.length || 0} logic blocks</p>

function AiDppGenerator({onSave, onCancel}){
  const [topic, setTopic] = useState("");
  const [batch, setBatch] = useState("");
  const [loading, setLoading] = useState(false);
  const [preview, setPreview] = useState(null);

  async function callAiPipeline(){
    if(!topic.trim() || !batch) return;
    setLoading(true);
    try {
      const prompt = `Create a Maths DPP on Topic: ${topic} for ${batch}. Return structural valid JSON array array only.`;
      const res = await fetch("https://maths-dpp-production.up.railway.app/generate",{
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({prompt})
      });
      const data = await res.json();
      const questions = JSON.parse(data.text.replace(/```json|```/g,"").trim());
      setPreview({id:"AI_"+uid(), title:topic+" – Synthetic Matrix Framework", batch, chapter:topic, questions});
    } catch(e) { alert("AI core translation logic failure."); }
    setLoading(false);
  }

  if(preview) {
    return (
      <div style={{maxWidth:650, margin:'0 auto'}} className="fade-up">
        <div className="glass-panel" style={{marginBottom:20, textAlign:'center', padding:32}}>
          <i className="fa-solid fa-microchip" style={{fontSize:36, color:'var(--cyan)', marginBottom:14}}></i>
          <h3>Data Parameters Built Successfully</h3>
          <p style={{fontSize:13, color:'var(--muted)', marginTop:4}}>Target structural parameters compiled and ready for deployment.</p>
        </div>
        <div style={{display:'flex', gap:14}}>
          <button onClick={()=>setPreview(null)} className="sec-btn" style={{flex:1, justifyContent:'center'}}>Flush Buffer</button>
          <button onClick={()=>onSave(preview)} className="premium-btn" style={{flex:1}}>Commit to Cloud Node</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{maxWidth:500, margin:'0 auto'}} className="scale-in">
      <div className="glass-panel" style={{padding:32}}>
        <h3 style={{fontSize:20, marginBottom:20}}><i className="fa-solid fa-robot" style={{color:'var(--cyan)', marginRight:10}}></i> AI Synthesis Hub</h3>
        <span className="section-label">TARGET MATHEMATICAL DISCIPLINE</span>
        <input placeholder="e.g., Trigonometric Formulations..." value={topic} onChange={e=>setTopic(e.target.value)} style={{marginBottom:20}} />
        
        <span className="section-label">COHORT TARGET CATEGORY</span>
        <select value={batch} onChange={e=>setBatch(e.target.value)} style={{marginBottom:28}}>
          <option value="">-- Choose Target Batch --</option>
          <option value="class10">Class 10 Matriculation</option>
          <option value="class8">Class 8 Intermediate</option>
        </select>

        <button onClick={callAiPipeline} disabled={loading || !topic.trim()} className="premium-btn" style={{width:'100%', padding:16}}>
          {loading ? 'Executing Optimization Core...':'Initialize Core Engine Model'}
        </button>
      </div>
    </div>
  );
}

function dbSaveDpp(dpp){ return firebase.database().ref("dpps/"+dpp.id).set(dpp); }
function dbDeleteDpp(id){
  return firebase.database().ref("dpps/"+id).remove().then(()=>
    firebase.database().ref("submissions/"+id).remove()
  );
}
function dbSubmit(dppId,sub){ return firebase.database().ref("submissions/"+dppId+"/"+sub.id).set(sub); }
