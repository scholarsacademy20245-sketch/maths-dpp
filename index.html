<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6fd;
  --surface:#ffffff;
  --surface2:#f3f2fb;
  --border:#e6e3f8;
  --accent:#5b3df6;
  --accent2:#7b4dff;
  --accent3:#0ea5e9;
  --green:#16a34a;
  --red:#ef4444;
  --gold:#f5a300;
  --text:#1e1b2e;
  --muted:#6b6b85;
  --dim:#9997b8;
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-in-out:cubic-bezier(.65,0,.35,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  min-height:100vh;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  background-image:
    radial-gradient(ellipse 80% 50% at 70% -10%,rgba(99,102,241,.09) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 10% 90%,rgba(167,139,250,.06) 0%,transparent 55%),
    radial-gradient(ellipse 40% 30% at 90% 60%,rgba(56,189,248,.04) 0%,transparent 50%);
}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(99,102,241,.4);border-radius:99px}

/* ── Base inputs ── */
input,textarea,select{
  font-family:inherit;
  transition:border-color .25s var(--ease-out),box-shadow .25s var(--ease-out),background .25s;
}
input:focus,textarea:focus,select:focus{
  outline:none;
  border-color:var(--accent)!important;
  box-shadow:0 0 0 3px rgba(99,102,241,.2),0 2px 8px rgba(99,102,241,.1)!important;
}

/* ══════════════════════════════════════════════
   KEYFRAMES
══════════════════════════════════════════════ */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(22px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes fadeDown{
  from{opacity:0;transform:translateY(-16px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{
  from{opacity:0;transform:scale(.88)}
  to{opacity:1;transform:scale(1)}
}
@keyframes slideRight{
  from{opacity:0;transform:translateX(-20px)}
  to{opacity:1;transform:translateX(0)}
}
@keyframes slideLeft{
  from{opacity:0;transform:translateX(20px)}
  to{opacity:1;transform:translateX(0)}
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
@keyframes pulseBig{0%,100%{box-shadow:0 0 0 0 rgba(99,102,241,.4)}70%{box-shadow:0 0 0 10px rgba(99,102,241,0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes floatGlow{
  0%,100%{box-shadow:0 0 20px rgba(99,102,241,.35),0 0 40px rgba(99,102,241,.1)}
  50%{box-shadow:0 0 32px rgba(99,102,241,.55),0 0 60px rgba(167,139,250,.15)}
}
@keyframes borderDance{
  0%,100%{border-color:rgba(99,102,241,.3)}
  50%{border-color:rgba(167,139,250,.6)}
}
@keyframes countUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes checkPop{
  0%{transform:scale(0) rotate(-15deg);opacity:0}
  70%{transform:scale(1.2) rotate(3deg);opacity:1}
  100%{transform:scale(1) rotate(0);opacity:1}
}
@keyframes scoreReveal{
  0%{opacity:0;transform:scale(.5)}
  60%{transform:scale(1.08)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes progressFill{from{width:0}to{width:var(--w)}}
@keyframes navSlide{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:translateY(0)}}
@keyframes dotBounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
@keyframes cardEntrance{
  from{opacity:0;transform:translateX(-10px) scale(.97)}
  to{opacity:1;transform:translateX(0) scale(1)}
}

/* ── Animation Classes ── */
.fade-up{animation:fadeUp .5s var(--ease-out) both}
.fade-down{animation:fadeDown .4s var(--ease-out) both}
.fade-in{animation:fadeIn .35s ease both}
.scale-in{animation:scaleIn .4s var(--ease-spring) both}
.slide-right{animation:slideRight .4s var(--ease-out) both}
.slide-left{animation:slideLeft .4s var(--ease-out) both}
.pop-in{animation:scaleIn .45s var(--ease-spring) both}

/* Stagger system */
.stagger>*{animation:fadeUp .5s var(--ease-out) both;opacity:0}
.stagger>*:nth-child(1){animation-delay:.04s}
.stagger>*:nth-child(2){animation-delay:.1s}
.stagger>*:nth-child(3){animation-delay:.16s}
.stagger>*:nth-child(4){animation-delay:.22s}
.stagger>*:nth-child(5){animation-delay:.28s}

.stagger-sm>*{animation:fadeUp .4s var(--ease-out) both;opacity:0}
.stagger-sm>*:nth-child(1){animation-delay:.02s}
.stagger-sm>*:nth-child(2){animation-delay:.06s}
.stagger-sm>*:nth-child(3){animation-delay:.10s}
.stagger-sm>*:nth-child(4){animation-delay:.14s}
.stagger-sm>*:nth-child(5){animation-delay:.18s}
.stagger-sm>*:nth-child(6){animation-delay:.22s}
.stagger-sm>*:nth-child(7){animation-delay:.26s}
.stagger-sm>*:nth-child(8){animation-delay:.30s}
.stagger-sm>*:nth-child(9){animation-delay:.34s}
.stagger-sm>*:nth-child(10){animation-delay:.38s}

/* ── Glass card ── */
.glass{
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(20px) saturate(1.2);
  -webkit-backdrop-filter:blur(20px) saturate(1.2);
  border:1px solid rgba(91,61,246,.15);
  border-radius:22px;
}

/* ── Button glow ── */
.btn-glow{
  position:relative;overflow:hidden;
  transition:transform .2s var(--ease-spring),box-shadow .2s var(--ease-out);
  cursor:pointer;
}
.btn-glow::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.14) 0%,transparent 55%,rgba(255,255,255,.04) 100%);
  opacity:0;transition:opacity .25s;
}
.btn-glow:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 10px 28px rgba(99,102,241,.45)}
.btn-glow:hover::before{opacity:1}
.btn-glow:active{transform:translateY(0) scale(.98);transition-duration:.08s}

/* ── Ripple ── */
.ripple{position:relative;overflow:hidden}
.ripple::after{
  content:'';position:absolute;
  width:0;height:0;border-radius:50%;
  background:rgba(255,255,255,.18);
  top:50%;left:50%;transform:translate(-50%,-50%);
  transition:width .5s var(--ease-out),height .5s var(--ease-out),opacity .5s;
  opacity:0;
}
.ripple:active::after{width:260%;height:260%;opacity:0;transition-duration:.4s}

/* ── Card hover lift ── */
.card-hover{
  transition:transform .25s var(--ease-out),border-color .25s,box-shadow .25s var(--ease-out);
}
.card-hover:hover{
  transform:translateY(-4px) scale(1.005);
  border-color:rgba(99,102,241,.5)!important;
  box-shadow:0 16px 40px rgba(99,102,241,.2),0 4px 8px rgba(0,0,0,.3)!important;
}
.card-hover:active{transform:translateY(-1px) scale(1.002);transition-duration:.1s}

/* ── Live dot ── */
.live-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px var(--green);
  animation:pulse 2.2s ease-in-out infinite;
  display:inline-block;flex-shrink:0;
}

/* ── Badge ── */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:99px;
  font-size:11px;font-weight:700;letter-spacing:.2px;
}

/* ── Difficulty ── */
.diff-easy{background:rgba(22,163,74,.1);color:#15803d;border:1px solid rgba(22,163,74,.25)}
.diff-med{background:rgba(245,158,11,.12);color:#b45309;border:1px solid rgba(245,158,11,.3)}
.diff-hard{background:rgba(239,68,68,.1);color:#dc2626;border:1px solid rgba(239,68,68,.25)}

/* ── DPP accent card ── */
.dpp-accent-card{position:relative}
.dpp-accent-card::before{
  content:'';
  position:absolute;left:0;top:12%;bottom:12%;
  width:3px;
  background:linear-gradient(180deg,#5b3df6,#7b4dff,#38bdf8);
  border-radius:99px;
  transition:top .3s,bottom .3s,opacity .3s;
}
.dpp-accent-card:hover::before{top:0;bottom:0;opacity:1}

/* ── Greeting card ── */
.greeting-card{
  background:linear-gradient(135deg,rgba(99,102,241,.13) 0%,rgba(124,58,237,.07) 50%,rgba(56,189,248,.04) 100%);
  border:1px solid rgba(99,102,241,.22);
  border-radius:20px;padding:18px 20px;margin-bottom:16px;
  animation:borderDance 4s ease-in-out infinite;
  position:relative;overflow:hidden;
}
.greeting-card::after{
  content:'';position:absolute;top:-30%;right:-10%;
  width:180px;height:180px;
  background:radial-gradient(circle,rgba(167,139,250,.08) 0%,transparent 70%);
  pointer-events:none;
}

/* ── Search ── */
.search-wrap{position:relative;margin-bottom:14px}
.search-input{
  width:100%;padding:12px 16px 12px 42px;
  border-radius:14px;border:1.5px solid var(--border);
  background:var(--surface2);color:var(--text);
  font-size:14px;font-family:inherit;
  transition:border-color .25s,box-shadow .25s,background .25s;
}
.search-input:focus{
  background:var(--surface);
  border-color:var(--accent)!important;
  box-shadow:0 0 0 3px rgba(99,102,241,.18)!important;
}
.search-input::placeholder{color:var(--muted)}
.search-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:15px;pointer-events:none;
  transition:color .25s;
}
.search-wrap:focus-within .search-icon{color:var(--accent2)}

/* ── Progress bar ── */
.prog-bar-wrap{height:7px;background:var(--border);border-radius:99px;overflow:hidden}
.prog-bar-fill{
  height:100%;border-radius:99px;
  background:linear-gradient(90deg,#5b3df6,#7b4dff,#7b4dff);
  background-size:200% 100%;
  animation:shimmer 2s linear infinite;
  transition:width .8s var(--ease-out);
}

/* ── Shimmer skeleton ── */
.shimmer{
  background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 50%,var(--surface2) 75%);
  background-size:200% 100%;
  animation:shimmer 1.5s infinite;border-radius:8px;
}

/* ── Score reveal ── */
.score-reveal{animation:scoreReveal .6s var(--ease-spring) both}
.check-pop{animation:checkPop .5s var(--ease-spring) both}

/* ── Tab indicator ── */
.tab-active{
  background:linear-gradient(135deg,#5b3df6,#7b4dff)!important;
  color:#fff!important;
  box-shadow:0 4px 16px rgba(99,102,241,.4)!important;
  transform:scale(1.02);
}

/* ── MCQ option ── */
.mcq-option{
  transition:background .18s,border-color .18s,transform .15s var(--ease-spring),box-shadow .18s;
  cursor:pointer;user-select:none;
}
.mcq-option:hover{background:rgba(99,102,241,.12)!important;border-color:rgba(99,102,241,.5)!important}
.mcq-option:active{transform:scale(.98)}
.mcq-option.selected{
  background:rgba(99,102,241,.18)!important;
  border-color:#5b3df6!important;
  box-shadow:0 4px 14px rgba(99,102,241,.2);
}

/* ── Card entrance for DPP list ── */
.card-entrance{animation:cardEntrance .4s var(--ease-out) both}

/* ── Heading font ── */
h1,h2,h3,.display{font-family:'Poppins',system-ui,sans-serif;letter-spacing:-.3px}

/* ── Nav bar glass ── */
.nav-glass{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(24px) saturate(1.4);
  -webkit-backdrop-filter:blur(24px) saturate(1.4);
  border-bottom:1px solid rgba(91,61,246,.12);
  animation:navSlide .4s var(--ease-out) both;
}

/* ── Floating label input ── */
.input-wrap{position:relative;margin-bottom:16px}
.input-label{
  display:block;font-size:11px;font-weight:700;
  color:var(--muted);text-transform:uppercase;letter-spacing:.8px;
  margin-bottom:7px;transition:color .2s;
}
.input-wrap:focus-within .input-label{color:var(--accent2)}

/* ── Stat box ── */
.stat-box{
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:14px 16px;flex:1;min-width:80px;
  transition:border-color .2s,transform .2s var(--ease-spring);
  animation:fadeUp .5s var(--ease-out) both;
}
.stat-box:hover{border-color:rgba(99,102,241,.4);transform:translateY(-2px)}

/* ── Loading dots ── */
.dot-loading span{
  display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--accent2);margin:0 3px;
  animation:dotBounce 1.4s ease-in-out infinite;
}
.dot-loading span:nth-child(1){animation-delay:0s}
.dot-loading span:nth-child(2){animation-delay:.2s}
.dot-loading span:nth-child(3){animation-delay:.4s}

/* ── Responsive ── */
@media(max-width:420px){
  .hide-sm{display:none!important}
}
</style>

<script>
// Error display for debugging
window.__errors = [];
window.onerror = function(msg, src, line, col, err) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#ff0000;color:#fff;padding:12px;font-size:13px;font-family:monospace;z-index:99999;';
  d.textContent = 'JS Error: ' + msg + ' (line ' + line + ')';
  document.body.appendChild(d);
};
window.addEventListener('unhandledrejection', function(e) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:40px;left:0;right:0;background:#cc0000;color:#fff;padding:12px;font-size:13px;font-family:monospace;z-index:99999;';
  d.textContent = 'Promise Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
  document.body.appendChild(d);
});
</script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const TEACHER_PIN = "7210";

const MCQ_OPTS = ["A","B","C","D"];
function uid(){ return Math.random().toString(36).slice(2,9); }
function emptyOpts(){ return ["","","",""]; }
function emptyQ(){ return {text:"",type:"mcq",options:emptyOpts(),answer:"",marks:""}; }
function emptyDpp(){ return {title:"",batch:"",chapter:"",questions:[]}; }

// ── Firebase ──────────────────────────────────────────────────────────────
function dbSaveDpp(dpp){
  return firebase.database().ref("dpps/"+dpp.id).set(dpp);
}
function dbDeleteDpp(id){
  return firebase.database().ref("dpps/"+id).remove().then(()=>
    firebase.database().ref("submissions/"+id).remove()
  );
}
function dbSubmit(dppId,sub){
  return firebase.database().ref("submissions/"+dppId+"/"+sub.id).set(sub);
}
function useDpps(){
  const [dpps,setDpps]=useState({});
  useEffect(()=>{
    const ref=firebase.database().ref("dpps");
    ref.on("value",snap=>setDpps(snap.val()||{}));
    return ()=>ref.off();
  },[]);
  return dpps;
}
function useSubmissions(dppId){
  const [subs,setSubs]=useState({});
  useEffect(()=>{
    if(!dppId) return;
    const ref=firebase.database().ref("submissions/"+dppId);
    ref.on("value",snap=>setSubs(snap.val()||{}));
    return ()=>ref.off();
  },[dppId]);
  return subs;
}
function useAllSubmissions(){
  const [subs,setSubs]=useState({});
  useEffect(()=>{
    const ref=firebase.database().ref("submissions");
    ref.on("value",snap=>setSubs(snap.val()||{}));
    return ()=>ref.off();
  },[]);
  return subs;
}

// ── Seed ──────────────────────────────────────────────────────────────────
const SEED_DPP={id:"QE10CH4",title:"Quadratic Equations – DPP 1",batch:"class10",chapter:"Quadratic Equations",questions:[
  {text:"Which of the following is a quadratic equation?",type:"mcq",options:["2x + 5 = 0","x² - 7x + 10 = 0","x³ - 4 = 0","1/x + 2 = 0"],answer:"B",marks:"1",image:""},
  {text:"The roots of x² - 16 = 0 are:",type:"mcq",options:["4, -4","16, -16","8, -8","2, -2"],answer:"A",marks:"1",image:""},
  {text:"The sum of the roots of x² - 9x + 20 = 0 is:",type:"mcq",options:["20","9","-9","-20"],answer:"B",marks:"1",image:""},
  {text:"The product of the roots of x² - 8x + 15 = 0 is:",type:"mcq",options:["8","15","-8","-15"],answer:"B",marks:"1",image:""},
  {text:"The discriminant of x² - 6x + 9 = 0 is:",type:"mcq",options:["36","0","9","18"],answer:"B",marks:"1",image:""}
]};
function seedDpp(){
  firebase.database().ref("dpps/QE10CH4").once("value",function(snap){
    if(!snap.val()) firebase.database().ref("dpps/QE10CH4").set(SEED_DPP);
  });
}

// ── Score helper ──────────────────────────────────────────────────────────
function calcScore(dpp, answers){
  let got=0, total=0;
  if(!dpp||!dpp.questions) return {got:0,total:0,pct:0};
  const ans=answers||{};
  dpp.questions.forEach((q,i)=>{
    if(q.type!=="subjective"&&q.answer){
      total+=Number(q.marks||1);
      if((ans[i]||"").toUpperCase()===q.answer.toUpperCase()) got+=Number(q.marks||1);
    }
  });
  return {got, total, pct: total>0?Math.round((got/total)*100):0};
}

// ── Common Styles ─────────────────────────────────────────────────────────
const inputS={width:"100%",padding:"12px 16px",borderRadius:12,border:"1.5px solid var(--border)",fontSize:14,background:"var(--surface2)",color:"var(--text)",transition:"all .2s"};
const labelS={fontSize:11,fontWeight:700,color:"var(--accent2)",margin:"14px 0 6px",display:"block",textTransform:"uppercase",letterSpacing:1.5};
const btn=(bg,extra={})=>({background:bg,color:"#fff",border:"none",borderRadius:14,padding:"11px 22px",fontSize:14,fontWeight:700,cursor:"pointer",transition:"all .2s",letterSpacing:.3,...extra});
const card={background:"var(--surface)",border:"1px solid var(--border)",borderRadius:22,padding:"22px",backdropFilter:"blur(12px)"};

// ── APP ───────────────────────────────────────────────────────────────────
function App(){
  useEffect(()=>{ seedDpp(); },[]);
  const [mode,setMode]=useState(null);
  const [auth,setAuth]=useState(false);
  const [pin,setPin]=useState("");
  const [pinErr,setPinErr]=useState(false);
  if(!mode) return <Landing onSelect={setMode}/>;
  if(mode==="teacher"&&!auth) return <PinScreen pin={pin} setPin={setPin} error={pinErr}
    onSubmit={()=>{ if(pin===TEACHER_PIN){setAuth(true);setPinErr(false);}else{setPinErr(true);setPin("");} }}
    onBack={()=>setMode(null)}/>;
  if(mode==="teacher") return <TeacherPanel onBack={()=>{setMode(null);setAuth(false);}}/>;
  if(mode==="student") return <StudentHome onBack={()=>setMode(null)}/>;
  return null;
}

// ── LANDING ───────────────────────────────────────────────────────────────
function Landing({onSelect}){
  return(
    <div style={{minHeight:"100vh",background:"radial-gradient(ellipse at 55% 0%,#efeafe 0%,#ffffff 55%)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"24px 16px",position:"relative",overflow:"hidden"}}>
      {/* Ambient blobs */}

function StudentHome({onBack}){
  const [classSelected,setClassSelected]=useState(null);
  const [activeDpp,setActiveDpp]=useState(null);
  const [tab,setTab]=useState("dpps");

  // Phone-based login state
  const [loginStep,setLoginStep]=useState("phone"); // "phone" | "register" | "done"
  const [phoneInput,setPhoneInput]=useState("");
  const [nameInput,setNameInput]=useState("");
  const [studentProfile,setStudentProfile]=useState(null); // {name, phone, studentId}
  const [loginLoading,setLoginLoading]=useState(false);
  const [loginErr,setLoginErr]=useState("");

  // Check localStorage for saved session
  useEffect(()=>{
    const saved=localStorage.getItem("student_profile");
    if(saved){
      try{
        const p=JSON.parse(saved);
        if(p&&p.phone&&p.name){ setStudentProfile(p); setLoginStep("done"); }
      }catch(e){}
    }
  },[]);

  function formatPhone(raw){
    // Keep only digits, limit to 10
    return raw.replace(/\D/g,"").slice(0,10);
  }

  async function handlePhoneSubmit(){
    const phone=phoneInput.trim();
    if(phone.length!==10){setLoginErr("10 digit ka phone number daalo");return;}
    setLoginLoading(true);setLoginErr("");
    try{
      const snap=await firebase.database().ref("students/"+phone).once("value");
      const existing=snap.val();
      if(existing&&existing.name){
        const profile={name:existing.name,phone,studentId:"SA"+phone};
        localStorage.setItem("student_profile",JSON.stringify(profile));
        setStudentProfile(profile);
        setLoginStep("done");
      } else {
        setLoginStep("register");
      }
    }catch(e){setLoginErr("Network error. Dobara try karo.");}
    setLoginLoading(false);
  }

  async function handleRegister(){
    const name=nameInput.trim();
    if(!name){setLoginErr("Apna naam likhein");return;}
    const phone=phoneInput.trim();
    setLoginLoading(true);setLoginErr("");
    try{
      const profile={name,phone,studentId:"SA"+phone,joinedAt:Date.now()};
      await firebase.database().ref("students/"+phone).set(profile);
      const localProfile={name,phone,studentId:"SA"+phone};
      localStorage.setItem("student_profile",JSON.stringify(localProfile));
      setStudentProfile(localProfile);
      setLoginStep("done");
    }catch(e){setLoginErr("Save nahi hua. Dobara try karo.");}
    setLoginLoading(false);
  }

  function logout(){
    localStorage.removeItem("student_profile");
    setStudentProfile(null);setLoginStep("phone");
    setPhoneInput("");setNameInput("");setLoginErr("");
  }

  const name=studentProfile?studentProfile.name:"";

  if(activeDpp) return <DppAttempt dpp={activeDpp} name={name} onBack={()=>setActiveDpp(null)}/>;

  // ── Phone Login Screen ──
  if(loginStep!=="done") return(
    <div style={{minHeight:"100vh",background:"radial-gradient(ellipse 80% 60% at 50% -10%,#ede9ff,#ffffff 65%)",display:"flex",alignItems:"center",justifyContent:"center",padding:16,position:"relative",overflow:"hidden"}}>
      {/* Decorative blobs */}
      <div style={{position:"absolute",width:320,height:320,borderRadius:"50%",background:"radial-gradient(circle,rgba(99,102,241,.1) 0%,transparent 70%)",top:-60,right:-60,pointerEvents:"none"}}/>
      <div style={{position:"absolute",width:220,height:220,borderRadius:"50%",background:"radial-gradient(circle,rgba(124,58,237,.08) 0%,transparent 70%)",bottom:-40,left:-40,pointerEvents:"none"}}/>

      <div className="pop-in" style={{maxWidth:380,width:"100%",position:"relative"}}>
        {/* Card */}
        <div style={{background:"rgba(255,255,255,.92)",backdropFilter:"blur(24px)",border:"1px solid rgba(99,102,241,.18)",borderRadius:28,padding:"32px 28px",boxShadow:"0 24px 64px rgba(91,61,246,.18),0 4px 16px rgba(0,0,0,.06)"}}>
          <button onClick={onBack} style={{background:"rgba(99,102,241,.08)",border:"1px solid rgba(99,102,241,.15)",color:"var(--accent2)",fontSize:12,cursor:"pointer",fontWeight:700,padding:"6px 16px",borderRadius:99,marginBottom:22,transition:"all .2s"}}>← Home</button>

          <div style={{textAlign:"center",marginBottom:24}}>
            <div style={{width:76,height:76,background:"linear-gradient(135deg,#5b3df6,#a78bfa)",borderRadius:24,display:"flex",alignItems:"center",justifyContent:"center",fontSize:38,margin:"0 auto 14px",boxShadow:"0 10px 30px rgba(91,61,246,.4)"}}>
              {loginStep==="phone"?"📱":"🎓"}
            </div>
            {loginStep==="phone"&&<>
              <h2 style={{color:"var(--text)",fontWeight:900,fontSize:23,fontFamily:"'Poppins',sans-serif",letterSpacing:-.5}}>Student Login</h2>
              <p style={{color:"var(--muted)",fontSize:13,marginTop:6}}>Apna <b>phone number</b> daalo — yahi tumhari ID hai!</p>

              <input
                placeholder="10 digit number"
                value={phoneInput}

                autoFocus
              />
            </div>
            {loginErr&&<div style={{color:"var(--red)",fontSize:12,background:"rgba(239,68,68,.07)",border:"1px solid rgba(239,68,68,.2)",borderRadius:10,padding:"8px 12px",marginBottom:10,textAlign:"center"}}>⚠️ {loginErr}</div>}
            <button onClick={handlePhoneSubmit} disabled={loginLoading||phoneInput.length!==10} className="btn-glow"
              style={{...btn("linear-gradient(135deg,#5b3df6,#7b4dff)"),width:"100%",padding:"14px",fontSize:15,marginTop:6,borderRadius:16,opacity:phoneInput.length===10?1:0.45}}>
              {loginLoading?"⏳ Dhundh rahe hain...":"Aage Badhein →"}
            </button>
          </>}

          {loginStep==="register"&&<>
            <span style={labelS}>✏️ Apna Poora Naam</span>
            <input
              placeholder="Yahan naam likhein…"
              value={nameInput}
              onChange={e=>setNameInput(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&handleRegister()}
              style={inputS}
              autoFocus
            />
            {loginErr&&<div style={{color:"var(--red)",fontSize:12,background:"rgba(239,68,68,.07)",border:"1px solid rgba(239,68,68,.2)",borderRadius:10,padding:"8px 12px",marginBottom:10,marginTop:8,textAlign:"center"}}>⚠️ {loginErr}</div>}
            <div style={{display:"flex",gap:10,marginTop:14}}>
              <button onClick={()=>{setLoginStep("phone");setLoginErr("");}} style={{...btn("var(--surface2)"),flex:1,color:"var(--muted)",border:"1px solid var(--border)"}}>← Wapas</button>
              <button onClick={handleRegister} disabled={loginLoading||!nameInput.trim()} className="btn-glow"
                style={{...btn("linear-gradient(135deg,#5b3df6,#7b4dff)"),flex:2,padding:"14px",fontSize:15,borderRadius:16,opacity:nameInput.trim()?1:0.45}}>
                {loginLoading?"⏳ Save ho raha...":"Register Karo 🚀"}
              </button>
            </div>
          </>}
        </div>

        {/* Info note */}
        <div style={{textAlign:"center",marginTop:16,color:"var(--muted)",fontSize:12}}>
          🔒 Phone number sirf tumhari ID ke liye use hoga — kisi se share nahi hoga
        </div>
      </div>
    </div>
  );

  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#f6f6fd,#eeeafd,#ffffff)",padding:"20px 16px"}}>
      <div style={{maxWidth:600,margin:"0 auto"}}>
        {/* Header */}
        <div className="fade-up" style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
          <button onClick={onBack} style={{background:"var(--surface)",border:"none",color:"var(--accent2)",fontSize:13,cursor:"pointer",fontWeight:600,padding:"8px 14px",borderRadius:10}}>← Home</button>
          <div>
            <h2 style={{color:"var(--text)",fontWeight:800,fontSize:19,fontFamily:"'Poppins',sans-serif"}}>🎓 Student Corner</h2>
          </div>
        </div>

        {/* Greeting Card */}
        <div className="fade-up greeting-card" style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>

            <p style={{color:"var(--text)",fontWeight:700,fontSize:17,fontFamily:"'Poppins',sans-serif"}}>Namaste, <span style={{color:"var(--accent2)"}}>{name}! 👋</span></p>
            <div style={{display:"flex",alignItems:"center",gap:6,marginTop:4}}>
              <span style={{background:"rgba(99,102,241,.1)",border:"1px solid rgba(99,102,241,.18)",borderRadius:99,padding:"2px 10px",fontSize:11,fontWeight:700,color:"var(--accent2)"}}>📱 SA{studentProfile&&studentProfile.phone}</span>
            </div>
            <p style={{color:"var(--muted)",fontSize:12,marginTop:4}}>Aaj bhi practice karo, aage badhte raho! 🔥</p>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
            <button onClick={logout} title="Logout" style={{background:"rgba(239,68,68,.07)",border:"1px solid rgba(239,68,68,.18)",color:"var(--red)",fontSize:11,cursor:"pointer",fontWeight:600,padding:"5px 10px",borderRadius:99,transition:"all .2s"}}>↩ Logout</button>
            <div style={{width:46,height:46,borderRadius:14,background:"linear-gradient(135deg,#5b3df6,#a78bfa)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0,boxShadow:"0 4px 14px rgba(99,102,241,.4)"}}>

        {/* Tab Bar */}
        <div className="fade-up" style={{display:"flex",gap:6,marginBottom:20,background:"var(--surface)",borderRadius:16,padding:5,border:"1px solid var(--border)"}}>

  "Real Numbers","Polynomials","Linear Equations","Quadratic Equations",
  "Arithmetic Progressions","Triangles","Coordinate Geometry","Introduction to Trigonometry",

];
const CLASS8_CHAPTERS=[
  "Rational Numbers","Linear Equations in One Variable","Understanding Quadrilaterals",
  "Practical Geometry","Data Handling","Squares and Square Roots","Cubes and Cube Roots",
  "Comparing Quantities","Algebraic Expressions","Visualising Solid Shapes",
  "Mensuration","Exponents and Powers","Direct and Inverse Proportions",

];

function DppList({classKey,name,onSelect}){
  const dpps=useDpps();
  const [openChapter,setOpenChapter]=useState(null);
  const [search,setSearch]=useState("");

  const allForClass=Object.values(dpps).filter(d=>d.batch===classKey);
  const chapters=classKey==="class10"?CLASS10_CHAPTERS:CLASS8_CHAPTERS;

  // Group by chapter
  const byChapter={};
  allForClass.forEach(d=>{
    const ch=d.chapter||"Other";
    if(!byChapter[ch]) byChapter[ch]=[];
    byChapter[ch].push(d);
  });

  // Search mode
  if(search.trim()){
    const filtered=allForClass.filter(d=>
      d.title.toLowerCase().includes(search.toLowerCase())||
      (d.chapter||"").toLowerCase().includes(search.toLowerCase())
    );
    return(
      <div>
        <div className="search-wrap" style={{marginBottom:12}}>
          <span className="search-icon">🔍</span>
          <input className="search-input" placeholder="DPP ya chapter dhundho..." value={search} onChange={e=>setSearch(e.target.value)} autoFocus/>
          <button onClick={()=>setSearch("")} style={{background:"none",border:"none",color:"var(--muted)",cursor:"pointer",fontSize:16,padding:"0 8px"}}>✕</button>
        </div>
        {filtered.length===0?(
          <div style={{textAlign:"center",padding:"36px 0"}}>
            <div style={{fontSize:40,marginBottom:10}}>🤔</div>
            <p style={{color:"var(--muted)"}}>Koi DPP nahi mili</p>
          </div>
        ):(
          <div className="stagger-sm">
            {filtered.map(d=><DppCard key={d.id} dpp={d} onSelect={()=>onSelect(d)}/>)}
          </div>
        )}
      </div>
    );
  }

  if(allForClass.length===0) return(
    <div style={{textAlign:"center",padding:"48px 0"}}>
      <div style={{fontSize:48,marginBottom:10}}>📭</div>
      <p style={{color:"var(--muted)",fontSize:14}}>Is class ki abhi koi DPP nahi hai.</p>
    </div>
  );

  // Chapter folder view
  return(
    <div>
      <div className="search-wrap" style={{marginBottom:16}}>
        <span className="search-icon">🔍</span>
        <input className="search-input" placeholder="DPP ya chapter dhundho..." value={search} onChange={e=>setSearch(e.target.value)}/>
      </div>
      {chapters.map((ch,ci)=>{
        const chDpps=byChapter[ch]||[];
        const isOpen=openChapter===ch;
        const hasOtherDpps=byChapter["Other"]&&ch===chapters[chapters.length-1];
        return(
          <div key={ch}>
            <div onClick={()=>setOpenChapter(isOpen?null:ch)} className="card-hover"
              style={{display:"flex",alignItems:"center",justifyContent:"space-between",
                padding:"13px 16px",marginBottom:6,borderRadius:14,cursor:"pointer",
                background:isOpen?"rgba(99,102,241,.1)":"var(--surface)",
                border:`1px solid ${isOpen?"rgba(99,102,241,.35)":"var(--border)"}`,
                transition:"all .2s",boxShadow:isOpen?"0 4px 16px rgba(99,102,241,.12)":"none"}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>

      if(!el) return;
      const obs=new IntersectionObserver((entries)=>{
        entries.forEach(entry=>{
          if(entry.isIntersecting){
            // Question came into view
            qStartRef.current[i]=Date.now();
            setActiveQ(i);
          } else {
            // Question left view — save time spent
            if(qStartRef.current[i]){
              const spent=Math.floor((Date.now()-qStartRef.current[i])/1000);
              setQTimes(prev=>({...prev,[i]:(prev[i]||0)+spent}));

    return <DppDetail dpp={dpp} onBack={()=>{setDetailId(null);setView("list");}} onEdit={()=>{setEditDpp(dpp);setView("create");}} onDelete={async()=>{ await dbDeleteDpp(detailId); setDetailId(null); setView("list"); }}/>;
  }

  // All results: flatten
  const allResults=[];
  Object.entries(allSubs).forEach(([dppId,dppSubs])=>{
    const dpp=dpps[dppId];
    if(!dpp) return;
    Object.values(dppSubs).forEach(sub=>{
      const sc=calcScore(dpp,sub.answers);
      allResults.push({...sub,dppTitle:dpp.title,batch:dpp.batch,...sc});
    });
  });
  allResults.sort((a,b)=>b.submittedAt-a.submittedAt);

  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#f6f6fd,#eeeafd,#ffffff)",padding:"20px 16px"}}>
      <div style={{maxWidth:700,margin:"0 auto"}}>
        <div className="fade-up" style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <div>
            <button onClick={onBack} style={{background:"none",border:"none",color:"var(--accent2)",fontSize:13,cursor:"pointer",fontWeight:600,marginBottom:4,display:"block"}}>← Logout</button>
            <h2 style={{color:"var(--text)",fontSize:21,fontWeight:900}}>👨‍🏫 Teacher Panel</h2>
          </div>
          {tab==="dpps"&&<div style={{display:"flex",gap:8}}>
            <button onClick={()=>setView("ai")} style={{...btn("linear-gradient(135deg,#7b4dff,#7b4dff)",{padding:"11px 14px",fontSize:13})}}>🤖 AI DPP</button>
            <button onClick={()=>{setEditDpp(null);setView("create");}} style={{...btn("linear-gradient(135deg,#5b3df6,#7b4dff)",{padding:"11px 14px",fontSize:13})}}>+ New DPP</button>
          </div>}
        </div>

        {/* Stats Row */}
        <div className="fade-up" style={{display:"flex",gap:10,marginBottom:18,flexWrap:"wrap"}}>
          <StatBox label="Total DPPs" value={Object.keys(dpps).length} icon="📋"/>
          <StatBox label="Class 10" value={Object.values(dpps).filter(d=>d.batch==="class10").length} icon="📚"/>
          <StatBox label="Class 8" value={Object.values(dpps).filter(d=>d.batch==="class8").length} icon="📖"/>
          <StatBox label="Submissions" value={allResults.length} icon="📝"/>
        </div>

        {/* Tab Bar */}
        <div className="fade-up" style={{display:"flex",gap:5,marginBottom:18,background:"var(--surface)",borderRadius:16,padding:5,border:"1px solid var(--border)",overflowX:"auto"}}>
          {[["dpps","📋 DPPs"],["students","👥 Students"],["results","📊 Results"],["leaderboard","🏆 Top"]].map(([key,label])=>(
            <button key={key} onClick={()=>setTab(key)}
              style={{flex:1,padding:"9px 6px",borderRadius:10,border:"none",cursor:"pointer",fontWeight:700,fontSize:12,whiteSpace:"nowrap",
                background:tab===key?"linear-gradient(135deg,#5b3df6,#7b4dff)":"none",
                color:tab===key?"#fff":"var(--muted)",transition:"all .2s"}}>
              {label}
            </button>
          ))}
        </div>

        {/* DPPs Tab */}
        {tab==="dpps"&&(
          <div className="fade-up">
            {Object.keys(dpps).length===0
              ? <div style={{textAlign:"center",padding:"50px 0"}}>
                  <div style={{fontSize:50,marginBottom:8}}>📭</div>
                  <p style={{color:"var(--muted)"}}>Koi DPP nahi hai. "+ New DPP" dabao!</p>
                </div>
              : Object.values(dpps).map(d=>(
                <div key={d.id} onClick={()=>{setDetailId(d.id);setView("detail");}}
                  style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:14,padding:"14px 16px",marginBottom:8,cursor:"pointer",
                    display:"flex",justifyContent:"space-between",alignItems:"center"}}
                  onMouseEnter={e=>{e.currentTarget.style.borderColor="#5b3df6";e.currentTarget.style.background="var(--border)";}}
                  onMouseLeave={e=>{e.currentTarget.style.borderColor="var(--border)";e.currentTarget.style.background="var(--surface)";}}>
                  <div>
                    <p style={{fontWeight:800,color:"var(--text)",marginBottom:5}}>{d.title}</p>
                    <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
                      <span style={{background:"var(--border)",color:"var(--accent2)",fontSize:11,fontWeight:700,padding:"2px 10px",borderRadius:20}}>{d.batch==="class10"?"Class 10":d.batch==="class8"?"Class 8":d.batch}</span>
                      <span style={{background:"var(--surface2)",color:"var(--muted)",fontSize:11,padding:"2px 10px",borderRadius:20}}>{d.questions.length} Qs</span>
                    </div>
                  </div>
                  <span style={{color:"var(--dim)",fontSize:18}}>›</span>
                </div>
              ))
            }
          </div>
        )}

        {/* Students Tab */}
        {tab==="students"&&<TeacherStudents/>}

        {/* Leaderboard Management Tab */}
        {tab==="leaderboard"&&<TeacherLeaderboard/>}

        {/* All Results Tab */}
        {tab==="results"&&(
          <div className="fade-up">
            {allResults.length===0
              ? <div style={{textAlign:"center",padding:"50px 0"}}>
                  <div style={{fontSize:50,marginBottom:8}}>📭</div>
                  <p style={{color:"var(--muted)"}}>Abhi koi submission nahi hai.</p>
                </div>
              : allResults.map((r,i)=>(
                <div key={i} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:14,padding:"14px 16px",marginBottom:8}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                    <div>
                      <p style={{fontWeight:800,color:"var(--text)",fontSize:14}}>{r.studentName}</p>
                      <div style={{display:"flex",gap:5,alignItems:"center",marginTop:2,flexWrap:"wrap"}}>
                        {r.studentPhone&&<span style={{background:"rgba(99,102,241,.1)",color:"var(--accent2)",fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:20}}>📱 {r.studentPhone}</span>}
                        <span style={{background:"var(--border)",color:"var(--accent2)",fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:20}}>
                          {r.batch==="class10"?"Class 10":r.batch==="class8"?"Class 8":r.batch}
                        </span>
                      </div>
                      <p style={{color:"var(--muted)",fontSize:11,marginTop:2}}>{r.dppTitle}</p>
                    </div>
                    <div style={{textAlign:"right"}}>
                      <p style={{fontWeight:900,color:"var(--accent2)",fontSize:18}}>{r.pct}%</p>
                      <p style={{color:"var(--dim)",fontSize:11}}>{r.got}/{r.total}M</p>
                      {r.totalTimeTaken>0&&(
                        <p style={{color:"#ef4444",fontSize:10,fontWeight:700,marginTop:2}}>
                          ⏱ {Math.floor(r.totalTimeTaken/60)>0?`${Math.floor(r.totalTimeTaken/60)}m ${r.totalTimeTaken%60}s`:`${r.totalTimeTaken}s`}
                        </p>
                      )}
                    </div>
                  </div>
                  {/* Per-Question Time Chips */}
                  {r.questionTimes&&Object.keys(r.questionTimes).length>0&&(
                    <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:8}}>
                      {Object.entries(r.questionTimes).sort((a,b)=>Number(a[0])-Number(b[0])).map(([qi,t])=>(
                        <span key={qi} style={{background:"rgba(248,113,113,.08)",border:"1px solid rgba(248,113,113,.18)",borderRadius:7,padding:"2px 7px",fontSize:10,color:"#ef4444",fontWeight:700}}>
                          Q{Number(qi)+1}: {t<60?`${t}s`:`${Math.floor(t/60)}m${t%60}s`}
                        </span>
                      ))}
                    </div>
                  )}
                  {/* Progress Bar */}
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <div style={{flex:1,height:6,background:"var(--border)",borderRadius:99,overflow:"hidden"}}>
                      <div style={{height:"100%",width:`${r.pct}%`,borderRadius:99,
                        background:r.pct>=80?"linear-gradient(90deg,#16a34a,#4ade80)":r.pct>=50?"linear-gradient(90deg,#d97706,#fbbf24)":"linear-gradient(90deg,#dc2626,#ef4444)",
                        transition:"width 0.8s ease"}}/>
                    </div>
                    <span style={{color:"var(--dim)",fontSize:10,minWidth:32}}>{new Date(r.submittedAt).toLocaleDateString("en-IN")}</span>
                  </div>
                </div>
              ))
            }
          </div>
        )}
      </div>
    </div>
  );
}
