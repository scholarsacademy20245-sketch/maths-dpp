<script type="text/babel">
const { useState, useEffect, useRef } = React;

// Smart KaTeX Equation Component
function MathText({ text }) {
  const spanRef = useRef(null);
  useEffect(() => {
    if (spanRef.current) {
      const hasMath = text.includes("$") || text.includes("^") || text.includes("_") || text.includes("\\");
      if (hasMath) {
        let cleanText = text.replace(/\$/g, "");
        try { katex.render(cleanText, spanRef.current, { throwOnError: false }); } 
        catch (e) { spanRef.current.textContent = text; }
      } else { spanRef.current.textContent = text; }
    }
  }, [text]);
  return <span ref={spanRef} />;
}

// Score Calculation
function calcScore(dpp, answers){
  let got=0, total=0;
  if(!dpp||!dpp.questions) return {got:0,total:0,pct:0};
  const ans=answers||{};
  dpp.questions.forEach((q,i)=>{
    if(q.type!=="subjective"&&q.answer){
      total+=Number(q.marks||1);
      if((ans[i]||"").toUpperCase()===q.answer.toUpperCase()) got+=Number(q.marks||1);
    }
  });
  return {got, total, pct: total>0?Math.round((got/total)*100):0};
}

// Custom Dynamic Hooks for Realtime Updates
function useDpps(){
  const [dpps,setDpps]=useState({});
  useEffect(()=>{
    const ref=firebase.database().ref("dpps");
    ref.on("value",snap=>setDpps(snap.val()||{}));
    return ()=>ref.off();
  },[]);
  return dpps;
}
function useAllSubmissions(){
  const [subs,setSubs]=useState({});
  useEffect(()=>{
    const ref=firebase.database().ref("submissions");
    ref.on("value",snap=>setSubs(snap.val()||{}));
    return ()=>ref.off();
  },[]);
  return subs;
}

function DppList({classKey, name, onSelect}){
  const dpps = useDpps();
  const [openChapter, setOpenChapter] = useState(null);
  const [search, setSearch] = useState("");

  const allForClass = Object.values(dpps).filter(d => d.batch === classKey);
  const chapters = classKey === "class10" ? CLASS10_CHAPTERS : CLASS8_CHAPTERS;

  const byChapter = {};
  allForClass.forEach(d => {
    const ch = d.chapter || "Other";
    if(!byChapter[ch]) byChapter[ch] = [];
    byChapter[ch].push(d);
  });

  return (
    <div className="fade-up">
      <div style={{position:'relative', marginBottom:20}}>
        <i className="fa-solid fa-magnifying-glass" style={{position:'absolute', left:16, top:16, color:'var(--muted)'}}></i>
        <input placeholder="Filter practice sheets by title parameter..." value={search} onChange={e=>setSearch(e.target.value)} style={{...inputS, paddingLeft:44}} />
      </div>

      {chapters.map((ch, ci) => {
        const chDpps = byChapter[ch] || [];
        const isOpen = openChapter === ch;
        if(search && !chDpps.some(d=>d.title.toLowerCase().includes(search.toLowerCase()))) return null;

        return (
          <div key={ch} style={{marginBottom:8}}>
            <div onClick={()=>chDpps.length > 0 && setOpenChapter(isOpen ? null:ch)} className="glass-card card-interactive" style={{padding:'16px 20px', display:'flex', justifyContent:'space-between', alignItems:'center', cursor:chDpps.length>0?'pointer':'not-allowed', opacity:chDpps.length>0?1:0.4}}>
              <div style={{display:'flex', alignItems:'center', gap:14}}>
                <i className={`fa-solid ${isOpen?'fa-folder-open':'fa-folder'}`} style={{color:chDpps.length>0?'var(--accent2)':'var(--dim)', fontSize:16}}></i>
                <span style={{fontWeight:600, fontSize:14}}>Ch {ci+1}. {ch}</span>
              </div>
              <div style={{display:'flex', alignItems:'center', gap:12}}>
                <span className="badge-custom diff-easy" style={{padding:'2px 8px', fontSize:10}}>{chDpps.length} Active</span>
                {chDpps.length > 0 && <i className="fa-solid fa-chevron-right" style={{color:'var(--muted)', transform:isOpen?'rotate(90deg)':'none', transition:'transform 0.2s'}}></i>}
              </div>
            </div>
            {isOpen && chDpps.length > 0 && (
              <div style={{padding:'8px 0 8px 20px', display:'flex', flexDirection:'column', gap:8}}>
                {chDpps.filter(d => d.title.toLowerCase().includes(search.toLowerCase())).map(d => (
                  <div key={d.id} className="glass-card card-interactive" style={{padding:'14px 20px', display:'flex', justifyContent:'space-between', alignItems:'center', background:'var(--surface2)'}}>
                    <div>
                      <h4 style={{fontSize:14, fontWeight:600}}>{d.title}</h4>
                      <p style={{fontSize:11, color:'var(--muted)', marginTop:4}}><i className="fa-regular fa-circle-question"></i> {d.questions?.length || 0} Questions loaded</p>
                    </div>
                    <button onClick={()=>onSelect(d)} className="btn-premium" style={{padding:'8px 16px', fontSize:12}}>Solve Sheet <i className="fa-solid fa-arrow-right" style={{marginLeft:4}}></i></button>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ── LEADERBOARD COMPONENT ──
function Leaderboard(){
  const dpps = useDpps();
  const allSubs = useAllSubmissions();
  const [filterClass, setFilterClass] = useState("all");

  const studentMap = {};
  Object.entries(allSubs).forEach(([dppId, dppSubs]) => {
    if(!dppSubs) return;
    const dpp = dpps[dppId];
    if(!dpp || (filterClass !== "all" && dpp.batch !== filterClass)) return;
    Object.values(dppSubs).forEach(sub => {
      if(!sub || !sub.studentName) return;
      const {got, total} = calcScore(dpp, sub.answers);
      if(!studentMap[sub.studentName]) studentMap[sub.studentName] = {name:sub.studentName, got:0, max:0, count:0};
      studentMap[sub.studentName].got += got;
      studentMap[sub.studentName].max += total;
      studentMap[sub.studentName].count += 1;
    });
  });

  const board = Object.values(studentMap)
    .map(s => ({...s, pct:s.max>0?Math.round((s.got/s.max)*100):0}))
    .sort((a,b)=>b.pct-a.pct);

  return (
    <div className="fade-up">
      <div style={{display:'flex', gap:6, background:'var(--surface)', border:'1px solid var(--border)', borderRadius:10, padding:4, marginBottom:16, maxWidth:280}}>
        [["all","Global Track"],["class10","Class 10"],["class8","Class 8"]].map(([k,l]) => (
          <button key={k} onClick={()=>setFilterClass(k)} style={{flex:1, border:'none', padding:'6px 12px', borderRadius:6, fontSize:12, fontWeight:600, cursor:'pointer', background:filterClass===k?'var(--surface2)':'transparent', color:filterClass===k?'white':'var(--muted)'}}>{l}</button>
        ))}
      </div>

      <div className="glass-card">
        {board.length === 0 ? <p style={{color:'var(--muted)', textAlign:'center', fontSize:13}}>No global metrics verified yet.</p>:(
          <div style={{display:'flex', flexDirection:'column', gap:12}}>
            {board.map((s, i) => (
              <div key={s.name} style={{display:'flex', alignItems:'center', gap:14, paddingBottom:12, borderBottom:i!==board.length-1?'1px solid var(--border)':'none'}}>
                <div style={{width:32, height:32, borderRadius:8, background:i===0?'rgba(245,158,11,0.15)':i===1?'rgba(148,163,184,0.15)':'rgba(15,21,36,1)', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:800, color:i===0?'var(--gold)':i===1?'#cbd5e1':'var(--muted)'}}>
                  #{i+1}
                </div>
                <div style={{flex:1}}>
                  <h4 style={{fontSize:14, fontWeight:600}}>{s.name}</h4>
                  <p style={{fontSize:11, color:'var(--muted)', marginTop:2}}>{s.count} modules integrated · Accumulation: {s.got}/{s.max} Marks</p>
                </div>
                <span style={{fontSize:16, fontWeight:700, color:'var(--accent2)'}}>{s.pct}%</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ── DPP ATTEMPT AREA ──
function DppAttempt({dpp, name, onBack}){
  const [answers, setAnswers] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [result, setResult] = useState(null);

  const answered = Object.keys(answers).length;
  const total = dpp.questions?.length || 0;
  const progress = total > 0 ? Math.round((answered/total)*100) : 0;

  async function processSubmission(){
    setSubmitting(true);
    const sub = {id:uid(), dppId:dpp.id, studentName:name, answers, submittedAt:Date.now()};
    await dbSubmit(dpp.id, sub);
    setResult(calcScore(dpp, answers));
    setSubmitted(true); setSubmitting(false);
  }

  if(submitted && result) {
    return (
      <div style={{maxWidth:600, margin:'0 auto'}} className="scale-in">
        <div className="glass-card" style={{textAlign:'center'}}>
          <div style={{width:64, height:64, background:'rgba(16,185,129,0.1)', borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 16px', border:'1px solid rgba(16,185,129,0.2)'}}>
            <i className="fa-solid fa-square-check" style={{color:'var(--green)', fontSize:28}}></i>
          </div>
          <h2>Assignment Completed</h2>
          <p style={{color:'var(--muted)', fontSize:13, marginTop:4}}>{dpp.title}</p>
          
          <div style={{background:'var(--surface2)', border:'1px solid var(--border)', borderRadius:16, padding:24, margin:'24px 0'}}>
            <p style={{fontSize:11, fontWeight:700, color:'var(--muted)', letterSpacing:1}}>ACCURACY RATE</p>
            <h1 style={{fontSize:48, fontWeight:800, color:'var(--accent2)', margin:'8px 0'}}>{result.pct}%</h1>
            <p style={{fontSize:13, color:'var(--text)'}}>Acquired Score: <strong>{result.got}</strong> / {result.total} Total Marks</p>
          </div>
          <button onClick={onBack} className="btn-premium" style={{width:'100%'}}>Return to Base Hub</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{maxWidth:700, margin:'0 auto'}} className="fade-up">
      <div className="glass-card" style={{marginBottom:16}}>
        <h3 style={{fontSize:18}}>{dpp.title}</h3>
        <p style={{fontSize:12, color:'var(--muted)', marginTop:4}}>Candidate Trace: {name} · Total variables: {total}</p>
        <div style={{display:'flex', alignItems:'center', gap:14, marginTop:16}}>
          <div className="prog-bar-wrap" style={{flex:1}}><div className="prog-bar-fill" style={{width:`${progress}%`}}/></div>
          <span style={{fontSize:12, fontWeight:700, color:'var(--accent2)'}}>{progress}% Finished</span>
        </div>
      </div>

      {dpp.questions?.map((q, i) => (
        <div key={i} className="glass-card" style={{marginBottom:12, borderColor:answers[i]?'var(--accent)':'var(--border)'}}>
          <h4 style={{fontSize:14, fontWeight:600, lineHeight:1.5, marginBottom:16}}>
            <span style={{color:'var(--accent2)', marginRight:8}}>Problem {i+1}.</span>
            <MathText text={q.text}/>
          </h4>
          
          {q.image && <img src={q.image} style={{maxWidth:'100%', maxHeight:220, borderRadius:8, marginBottom:16, border:'1px solid var(--border)'}}/>}
          
          {q.type==="mcq" && (
            <div style={{display:'flex', flexDirection:'column', gap:8}}>
              {MCQ_OPTS.map((opt, oi) => q.options[oi] && (
                <label key={opt} className={`mcq-option option-card ${answers[i]===opt?'selected':''}`} style={{display:'flex', alignItems:'center', gap:12, padding:14, background:'var(--surface)', border:'1px solid var(--border)', borderRadius:10, cursor:'pointer'}}>
                  <input type="radio" name={`q${i}`} value={opt} checked={answers[i]===opt} onChange={()=>setAnswers({...answers, [i]:opt})} style={{accentColor:'var(--accent)'}}/>
                  <span style={{fontWeight:700, color:'var(--accent2)'}}>{opt})</span>
                  <span style={{fontSize:13}}><MathText text={q.options[oi]}/></span>
                </label>
              ))}
            </div>
          ))}

          {q.type==="truefalse" && (
            <div style={{display:'flex', gap:12}}>
              {["True","False"].map(v => (
                <label key={v} className={`mcq-option option-card ${answers[i]===v?'selected':''}`} style={{flex:1, display:'flex', alignItems:'center', gap:10, padding:12, background:'var(--surface)', border:'1px solid var(--border)', borderRadius:10, cursor:'pointer'}}>
                  <input type="radio" name={`q${i}`} value={v} checked={answers[i]===v} onChange={()=>setAnswers({...answers, [i]:v})} style={{accentColor:'var(--accent)'}}/>
                  <span style={{fontSize:13}}>{v}</span>
                </label>
              ))}
            </div>
          )}

          {q.type==="subjective" && (
            <textarea placeholder="Write descriptive pipeline response step by step..." value={answers[i]||""} onChange={e=>setAnswers({...answers, [i]:e.target.value})} style={{...inputS, minHeight:90, background:'var(--surface)'}}/>
          )}
        </div>
      ))}

      <button onClick={processSubmission} disabled={submitting || total===0} className="btn-premium" style={{width:'100%', padding:16, fontSize:15, fontWeight:700, marginTop:12}}>
        {submitting ? 'Transmitting Data Arrays...':'Secure Transmission to Cloud'}
      </button>
    </div>
  );
}

// ── TEACHER PANEL CONTAINER ──
function TeacherPanel({onBack}){
  const [view, setView] = useState("list");
  const [tab, setTab] = useState("dpps");
  const [editDpp, setEditDpp] = useState(null);
  const [detailId, setDetailId] = useState(null);
  const dpps = useDpps();
  const allSubs = useAllSubmissions();

  if(view === "create") return <DppForm initial={editDpp} onSave={async dpp => { await dbSaveDpp(dpp); setEditDpp(null); setView("list"); }} onCancel={()=>{setEditDpp(null);setView("list");}}/>;
  if(view === "ai") return <AiDppGenerator onSave={async dpp => { await dbSaveDpp(dpp); setView("list"); }} onCancel={()=>setView("list")}/>;
  if(view === "detail" && detailId){
    const dpp = dpps[detailId]; if(!dpp) return null;
    return <DppDetail dpp={dpp} onBack={()=>{setDetailId(null);setView("list");}} onEdit={()=>{setEditDpp(dpp);setView("create");}} onDelete={async()=>{ await dbDeleteDpp(detailId); setDetailId(null); setView("list"); }}/>;
  }

  const resultsArr = [];
  Object.entries(allSubs).forEach(([dppId, dppSubs]) => {
    const dpp = dpps[dppId]; if(!dpp) return;
    Object.values(dppSubs).forEach(sub => {
      const sc = calcScore(dpp, sub.answers);
      resultsArr.push({...sub, title:dpp.title, batch:dpp.batch, ...sc});
    });
  });

  return (
    <div className="fade-up">
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:24}}>
        <h3>Control Workspace Terminal</h3>
        <div style={{display:'flex', gap:10}}>
          <button onClick={()=>setView("ai")} className="btn-sec" style={{color:'var(--cyan)', borderColor:'rgba(6,182,212,0.3)', background:'rgba(6,182,212,0.05)'}}><i className="fa-solid fa-microchip"></i> Synthetic AI Core</button>
          <button onClick={()=>{setEditDpp(null); setView("create");}} className="btn-premium">+ Build Framework</button>
        </div>
      </div>

      <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(140px, 1fr))', gap:16, marginBottom:30}}>
        <StatBox icon="fa-solid fa-folder-tree" val={Object.keys(dpps).length} title="Total Packages" />
        <StatBox icon="fa-solid fa-network-wired" val={resultsArr.length} title="Logs Recorded" />
      </div>

      <div style={{display:'flex', gap:10, background:'var(--surface)', border:'1px solid var(--border)', borderRadius:12, padding:6, marginBottom:20}}>
        <button onClick={()=>setTab("dpps")} style={{flex:1, padding:'10px', border:'none', borderRadius:8, fontWeight:600, fontSize:13, cursor:'pointer', background:tab === "dpps"?'var(--surface2)':'transparent', color:tab === "dpps"?'white':'var(--muted)'}}>Package Configs</button>
        <button onClick={()=>setTab("results")} style={{flex:1, padding:'10px', border:'none', borderRadius:8, fontWeight:600, fontSize:13, cursor:'pointer', background:tab === "results"?'var(--surface2)':'transparent', color:tab === "results"?'white':'var(--muted)'}}>Transmission Logs</button>
      </div>

      {tab==="dpps" && (
        <div style={{display:'flex', flexDirection:'column', gap:10}}>
          {Object.values(dpps).map(d => (
            <div key={d.id} onClick={()=>{setDetailId(d.id); setView("detail");}} className="glass-card card-interactive" style={{padding:16, display:'flex', justifyContent:'space-between', alignItems:'center', cursor:'pointer'}}>
              <div>
                <h4 style={{fontSize:15}}>{d.title}</h4>
                <p style={{fontSize:11, color:'var(--muted)', marginTop:4}}>Target: {d.batch==="class10"?"C10 Board":"C8 Primary"} · {d.questions?.length || 0} Nodes</p>
              </div>
              <i className="fa-solid fa-chevron-right" style={{color:'var(--dim)'}}></i>
            </div>
          ))}
        </div>
      )}

      {tab==="results" && (
        <div style={{display:'flex', flexDirection:'column', gap:10}}>
          {resultsArr.map((r, i) => (
            <div key={i} className="glass-card" style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
              <div>
                <h4 style={{fontSize:14}}>{r.studentName}</h4>
                <p style={{fontSize:12, color:'var(--muted)', marginTop:2}}>{r.title}</p>
              </div>
              <div style={{textAlign:'right'}}>
                <span style={{fontWeight:700, color:'var(--green)', fontSize:15}}>{r.pct}%</span>
                <p style={{fontSize:11, color:'var(--muted)', marginTop:2}}>{r.got}/{r.total} M</p>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function StatBox({icon, val, title}){
  return (
    <div className="glass-card" style={{textAlign:'center', padding:16}}>
      <i className={icon} style={{color:'var(--accent2)', fontSize:18, marginBottom:8}}></i>
      <h3>{val}</h3>
      <p style={{fontSize:10, color:'var(--muted)', textTransform:'uppercase', letterSpacing:0.5, marginTop:4}}>{title}</p>
    </div>
  );
}

// ── AI DPP GENERATOR INTERFACE ──
function AiDppGenerator({onSave, onCancel}){
  const [topic, setTopic] = useState("");
  const [batch, setBatch] = useState("");
  const [loading, setLoading] = useState(false);
  const [preview, setPreview] = useState(null);

  async function triggerAiCore(){
    if(!topic.trim() || !batch) return;
    setLoading(true);
    try {
      const prompt = `Create a Maths DPP on Topic: ${topic} for ${batch}. Return structural valid JSON array array only.`;
      const res = await fetch("https://maths-dpp-production.up.railway.app/generate",{
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({prompt})
      });
      const data = await res.json();
      const questions = JSON.parse(data.text.replace(/```json|```/g,"").trim());
      setPreview({id:"AI_"+uid(), title:topic+" – Synthetic Matrix", batch, chapter:topic, questions});
    } catch(e) { alert("Pipeline execution error."); }
    setLoading(false);
  }

  if(preview) {
    return (
      <div className="fade-up" style={{maxWidth:600, margin:'0 auto'}}>
        <div className="glass-card" style={{marginBottom:16, textAlign:'center'}}>
          <i className="fa-solid fa-microchip" style={{fontSize:32, color:'var(--cyan)', marginBottom:12}}></i>
          <h3>Package Compiled Successfully</h3>
          <p style={{fontSize:13, color:'var(--muted)', marginTop:4}}>Target structural data blocks written securely.</p>
        </div>
        <div style={{display:'flex', gap:12}}>
          <button onClick={()=>setPreview(null)} className="btn-sec" style={{flex:1}}>Reset Workspace</button>
          <button onClick={()=>onSave(preview)} className="btn-premium" style={{flex:1}}>Commit to Cloud</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{maxWidth:460, margin:'0 auto'}} className="scale-in">
      <div className="glass-card">
        <h3 style={{marginBottom:20}}><i className="fa-solid fa-robot" style={{color:'var(--cyan)', marginRight:8}}></i> AI Engine Matrix</h3>
        <span className="input-label" style={{fontSize:11, fontWeight:700, color:'var(--accent2)', display:'block', marginBottom:6}}>TARGET MATHEMATICAL TOPIC</span>
        <input placeholder="e.g., Quadratic Equations..." value={topic} onChange={e=>setTopic(e.target.value)} style={{...inputS, marginBottom:16}} />
        
        <span className="input-label" style={{fontSize:11, fontWeight:700, color:'var(--accent2)', display:'block', marginBottom:6}}>COHORT TARGET</span>
        <select value={batch} onChange={e=>setBatch(e.target.value)} style={{...inputS, marginBottom:24}}>
          <option value="">-- Choose Class --</option>
          <option value="class10">Class 10 Advanced</option>
          <option value="class8">Class 8 Standard</option>
        </select>

        <button onClick={triggerAiCore} disabled={loading || !topic.trim()} className="btn-premium" style={{width:'100%'}}>
          {loading ? 'Executing Engine Models...':'Trigger Configuration Build'}
        </button>
      </div>
    </div>
  );
}

// ── MANUAL SCHEDULER FORM ──
function DppForm({initial, onSave, onCancel}){
  const [dpp, setDpp] = useState(initial || {...emptyDpp(), id:uid()});
  function addProblemNode(){ setDpp({...dpp, questions:[...dpp.questions, emptyQ()]}); }
  
  return (
    <div style={{maxWidth:680, margin:'0 auto'}} className="fade-up">
      <div className="glass-card" style={{marginBottom:20}}>
        <h3>Structural Parameter Configuration</h3>
        <span className="input-label" style={{marginTop:16, display:'block', fontSize:11, fontWeight:700, color:'var(--accent2)'}}>SHEET TITLE DESCRIPTION</span>
        <input placeholder="e.g. Real Numbers Module..." value={dpp.title} onChange={e=>setDpp({...dpp, title:e.target.value})} style={inputS} />
        
        <span className="input-label" style={{marginTop:16, display:'block', fontSize:11, fontWeight:700, color:'var(--accent2)'}}>CLASS COHORT</span>
        <select value={dpp.batch} onChange={e=>setDpp({...dpp, batch:e.target.value})} style={{...inputS, marginTop:6}}>
          <option value="">-- Choose Class --</option>
          <option value="class10">Class 10</option>
          <option value="class8">Class 8</option>
        </select>
      </div>

      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16}}>
        <h4>Problems Variables Setup ({dpp.questions.length})</h4>
        <button onClick={addProblemNode} className="btn-premium" style={{padding:'6px 14px', fontSize:12}}>+ Add Problem Block</button>
      </div>

      {dpp.questions.map((q, i) => (
        <div key={i} className="glass-card" style={{marginBottom:12}}>
          <span style={{fontSize:12, fontWeight:700, color:'var(--accent2)'}}>NODE #{i+1}</span>
          <textarea placeholder="Write algebraic query expression prompt..." value={q.text} onChange={e=>{ let arr=[...dpp.questions]; arr[i].text=e.target.value; setDpp({...dpp, questions:arr}); }} style={{...inputS, minHeight:60, marginTop:8}} />
        </div>
      ))}

      <button onClick={()=>onSave(dpp)} className="btn-premium" style={{width:'100%', background:'var(--green)', marginTop:12}}>Commit Architecture Configurations</button>
    </div>
  );
}
