<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<!-- React, Babel, Firebase -->

<!-- Professional Fonts & Icon Packs -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- KaTeX for Premium Mathematical Equations Rendering -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

<style>
:root {
  --bg-main: #0b0f19;
  --bg-surface: #131a26;
  --bg-surface-hover: #1c2636;
  --border-color: #223147;
  --primary: #4f46e5;
  --primary-glow: rgba(79, 70, 229, 0.4);
  --accent: #06b6d4;
  --text-main: #f3f4f6;
  --text-muted: #9ca3af;
  --success: #10b981;
  --danger: #ef4444;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background-color: var(--bg-main);
  color: var(--text-main);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Premium Radial Background Glows */
.bg-glow {
  position: absolute;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(79, 70, 229, 0.08) 0%, transparent 70%);
  top: -200px;
  right: -100px;
  z-index: 0;
  pointer-events: none;
}

/* Glassmorphism Classes */
.glass-panel {
  background: rgba(19, 26, 38, 0.8);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border-color);
  border-radius: 16px;
}

/* Custom Interactive States */
.action-btn {
  background: linear-gradient(135deg, var(--primary) 0%, #6366f1 100%);
  color: white;
  border: none;
  padding: 12px 24px;
  border-radius: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 4px 14px var(--primary-glow);
}
.action-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(79, 70, 229, 0.6);
}

.option-card {
  background: var(--bg-surface);
  border: 2px solid var(--border-color);
  border-radius: 12px;
  padding: 16px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 12px;
}
.option-card:hover {
  border-color: var(--primary);
  background: var(--bg-surface-hover);
}
.option-card.selected {
  border-color: var(--success);
  background: rgba(16, 185, 129, 0.05);
}

/* Structural Layouts */
.app-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 16px;
  position: relative;
  z-index: 1;
}

h1, h2, h3 {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
}
</style>
</head>
<body>

<div class="bg-glow"></div>
<div id="root"></div>

<script>
  // Firebase Initialization
  const firebaseConfig = {
    apiKey: "AIzaSyCPfxXYuZHLNzksZZ8MnIHWIFNw4xpR5Bk",
    authDomain: "maths-dpp.firebaseapp.com",
    databaseURL: "https://maths-dpp-default-rtdb.asia-southeast1.firebasedatabase.app",

    appId: "1:59793322465:web:73f56c6893b929a7f2e2a0"
  };

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// Latex Formula Parser Component
function MathText({ text }) {
  const containerRef = useRef(null);
  useEffect(() => {
    if (containerRef.current) {
      // Direct high-speed KaTeX compilation
      try {
        katex.render(text, containerRef.current, { throwOnError: false, displayMode: false });
      } catch (e) {
        containerRef.current.textContent = text;
      }
    }
  }, [text]);
  return <span ref={containerRef} />;
}

function App() {
  const [view, setView] = useState("landing");
  const [studentName, setStudentName] = useState(localStorage.getItem("student_name") || "");

  return (
    <div className="app-container">
      {/* Premium Header/Navigation */}
      <header style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '40px', paddingBottom: '20px', borderBottom: '1px solid var(--border-color)' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
          <div style={{ background: 'var(--primary)', width: '40px', height: '40px', borderRadius: '10px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <i className="fa-solid fa-calculator" style={{ color: 'white' }}></i>
          </div>
          <div>
            <h2 style={{ fontSize: '20px', letterSpacing: '-0.5px' }}>Sameer Sir</h2>
            <p style={{ fontSize: '12px', color: 'var(--text-muted)' }}>Advanced Analytics DPP Portal</p>
          </div>
        </div>
        
        <div style={{ display: 'flex', gap: '12px' }}>
          <button className="action-btn" style={{ padding: '8px 16px', fontSize: '13px' }} onClick={() => setView("landing")}>
            <i className="fa-solid fa-house" style={{ marginRight: '6px' }}></i> Home
          </button>
        </div>
      </header>

      {view === "landing" && (
        <div style={{ display: 'grid', gridTemplateColumns: '1fr', gap: '24px', maxWidth: '600px', margin: '40px auto' }} className="glass-panel" style={{ padding: '32px' }}>
          <h1 style={{ textAlign: 'center', marginBottom: '8px', fontSize: '28px' }}>Welcome to Premium Dashboard</h1>
          <p style={{ textAlign: 'center', color: 'var(--text-muted)', marginBottom: '24px' }}>Apna portal mode chunein aur practice shuru karein.</p>
          
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
            <div className="option-card" style={{ flexDirection: 'column', textAlign: 'center', padding: '24px' }} onClick={() => setView("student")}>
              <i className="fa-solid fa-user-graduate" style={{ fontSize: '32px', color: 'var(--accent)', marginBottom: '12px' }}></i>
              <h3>Student Station</h3>
              <p style={{ fontSize: '12px', color: 'var(--text-muted)' }}>Solve mock sheets & view ranking</p>
            </div>
            
            <div className="option-card" style={{ flexDirection: 'column', textAlign: 'center', padding: '24px' }} onClick={() => setView("teacher")}>
              <i className="fa-solid fa-chalkboard-user" style={{ fontSize: '32px', color: 'var(--primary)', marginBottom: '12px' }}></i>
              <h3>Teacher Console</h3>
              <p style={{ fontSize: '12px', color: 'var(--text-muted)' }}>Manage sheets & track performance</p>
            </div>
          </div>
        </div>
      )}

      {/* Placeholder blocks for seamless routing */}
      {view === "student" && <div className="glass-panel" style={{ padding: '24px' }}><h3><i className="fa-solid fa-circle-notch fa-spin"></i> Loading Student Workspace...</h3></div>}
      {view === "teacher" && <div className="glass-panel" style={{ padding: '24px' }}><h3><i className="fa-solid fa-lock"></i> Verification Pin Required.</h3></div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
