<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Maths DPP – Sameer Sir</title>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#081510;
  --surface:#0d1f14;
  --surface2:#102619;
  --border:#1e3d27;
  --accent:#10b981;
  --accent3:#34d399;
  --gold2:#f0d382;
  --text:#f0fdf4;
  --muted:#86a994;
  --dim:#4d7a5e;
  --red:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  min-height:100vh;
  color:var(--text);
  background-image:
    radial-gradient(ellipse 70% 50% at 50% -5%,rgba(16,185,129,.13) 0%,transparent 65%),
    radial-gradient(ellipse 50% 40% at 5% 95%,rgba(212,175,55,.08) 0%,transparent 55%);
}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(16,185,129,.45)}

input,textarea,select{font-family:inherit;transition:border-color .25s,box-shadow .25s}
input:focus,textarea:focus,select:focus{
  outline:none;
  border-color:var(--accent)!important;
  box-shadow:0 0 0 3px rgba(16,185,129,.18)!important;
}

.container{max-width:1200px;margin:0 auto;padding:20px}

/* LOGIN */
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-card{
  background:linear-gradient(135deg,var(--surface2),var(--surface));
  border:2px solid var(--border);
  border-radius:20px;
  padding:40px;
  width:100%;
  max-width:400px;
}
.login-card h1{font-size:1.8rem;margin-bottom:10px;color:var(--accent3)}
.login-card p{color:var(--muted);margin-bottom:30px}
.login-input{
  width:100%;padding:12px 15px;background:var(--surface);border:2px solid var(--border);
  border-radius:10px;color:var(--text);margin-bottom:20px;font-size:1rem;
}
.login-btn{
  width:100%;padding:12px;background:linear-gradient(135deg,var(--accent),var(--accent3));
  color:#000;border:none;border-radius:10px;font-weight:700;font-size:1.1rem;cursor:pointer;
  transition:all .3s;
}
.login-btn:hover{transform:translateY(-2px)}
.error-msg{background:rgba(248,113,113,.1);color:var(--red);padding:12px;border-radius:8px;
  margin-bottom:20px;border-left:4px solid var(--red);}

/* STUDENT VIEW */
.student-header{text-align:center;margin-bottom:40px}
.student-header h1{font-size:2.5rem;font-weight:900;background:linear-gradient(135deg,var(--accent3),var(--gold2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}

.class-tabs{display:flex;gap:10px;margin-bottom:40px;flex-wrap:wrap;justify-content:center}
.tab-btn{padding:10px 20px;background:var(--surface);border:2px solid var(--border);border-radius:10px;
  color:var(--text);cursor:pointer;font-weight:600;transition:all .3s}
.tab-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}

.dpps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.dpp-card{padding:20px;background:linear-gradient(135deg,var(--surface2),var(--surface));
  border:2px solid var(--border);border-radius:12px;transition:all .3s;cursor:pointer}
.dpp-card:hover{border-color:var(--accent);transform:translateY(-4px);box-shadow:0 8px 16px rgba(16,185,129,.1)}

.dpp-title{font-weight:700;color:var(--accent3);margin-bottom:8px;font-size:1.1rem}
.dpp-info{color:var(--muted);font-size:.9rem;line-height:1.6}
.dpp-date{color:var(--dim);font-size:.85rem;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}

/* TEACHER PANEL */
.teacher-panel{background:var(--surface);border-radius:15px;padding:30px;margin-bottom:40px}
.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;
  padding-bottom:20px;border-bottom:2px solid var(--border)}
.panel-header h2{color:var(--accent3);font-size:1.8rem}
.logout-btn{padding:8px 16px;background:var(--red);color:white;border:none;border-radius:8px;
  font-weight:600;cursor:pointer;transition:all .3s}
.logout-btn:hover{background:#e05555}

.upload-section{background:linear-gradient(135deg,var(--surface2),var(--surface));border:2px dashed var(--border);
  padding:25px;border-radius:12px;margin-bottom:30px}
.upload-section h3{color:var(--accent3);margin-bottom:20px}
.upload-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:20px}
.upload-controls select,.upload-controls input{padding:10px 15px;background:var(--surface);border:2px solid var(--border);
  border-radius:8px;color:var(--text);font-size:.95rem}
.upload-controls button{padding:10px 20px;background:linear-gradient(135deg,var(--accent),var(--accent3));
  color:#000;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:all .3s}
.upload-controls button:hover{transform:scale(1.05)}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:30px}
.stat-box{padding:15px;background:var(--surface2);border:2px solid var(--border);border-radius:10px;text-align:center}
.stat-box .number{font-size:1.8rem;font-weight:900;color:var(--accent3)}
.stat-box .label{font-size:.85rem;color:var(--muted);margin-top:8px}

.message{padding:15px;background:rgba(16,185,129,.1);border-left:4px solid var(--accent);
  border-radius:8px;margin-bottom:20px;color:var(--accent3)}
.message.error{background:rgba(248,113,113,.1);border-left-color:var(--red);color:var(--red)}
.message.success{background:rgba(34,197,94,.1);border-left-color:var(--green);color:var(--accent3)}

.class-management{margin-top:30px}
.class-management h3{color:var(--accent3);margin-bottom:20px}
.dpp-list{background:var(--surface2);border:2px solid var(--border);border-radius:10px;
  padding:20px;max-height:400px;overflow-y:auto}
.dpp-item{padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;
  margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.dpp-item-info{flex:1}
.dpp-item-title{font-weight:600;color:var(--accent3);margin-bottom:4px}
.dpp-item-meta{font-size:.85rem;color:var(--muted)}
.delete-btn{padding:6px 12px;background:var(--red);color:white;border:none;border-radius:6px;
  cursor:pointer;font-size:.85rem;font-weight:600;transition:all .3s}
.delete-btn:hover{background:#e05555}

.teacher-hint{position:fixed;bottom:20px;right:20px;padding:12px 20px;background:rgba(16,185,129,.2);
  border:1px solid var(--accent);border-radius:8px;font-size:.85rem;color:var(--accent3);
  cursor:pointer;transition:all .3s;z-index:1000}
.teacher-hint:hover{background:rgba(16,185,129,.3)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const TEACHER_PASSWORD = "7210";

// ════════ TEACHER PANEL ════════
function TeacherPanel({onLogout}){
  const [dpps, setDpps] = React.useState([]);
  const [uploadTitle, setUploadTitle] = React.useState("");
  const [uploadClass, setUploadClass] = React.useState("class10");
  const [uploadQuestions, setUploadQuestions] = React.useState("0");
  const [message, setMessage] = React.useState("");
  const [dppStats, setDppStats] = React.useState({total:0, class7:0, class8:0, class10:0});

  React.useEffect(() => {
    const classes = ["class7", "class8", "class10"];
    classes.forEach(classKey => {
      const ref = firebase.database().ref(`dpps/${classKey}`);
      ref.on('value', (snap) => {
        const data = snap.val() || {};
        const dppsArray = Object.entries(data).map(([key, val]) => ({...val, key}));
        setDpps(prev => {
          const filtered = prev.filter(d => d.batch !== classKey);
          return [...filtered, ...dppsArray];
        });
      });
    });
  }, []);

  React.useEffect(() => {
    let stats = {total:0, class7:0, class8:0, class10:0};
    dpps.forEach(d => {
      stats.total++;
      if(d.batch === 'class7') stats.class7++;
      else if(d.batch === 'class8') stats.class8++;
      else if(d.batch === 'class10') stats.class10++;
    });
    setDppStats(stats);
  }, [dpps]);

  const handleUploadDPP = () => {
    if(!uploadTitle.trim()) {
      setMessage("Title likho bhai! ❌");
      setTimeout(() => setMessage(""), 3000);
      return;
    }
    
    const newId = `${uploadClass.toUpperCase()}DPP${Date.now()}`;
    const newDPP = {
      id: newId,
      title: uploadTitle,
      batch: uploadClass,
      questions: Array(parseInt(uploadQuestions) || 0).fill({text:"",type:"mcq",options:[],answer:"",marks:"1"}),
      uploadedAt: new Date().toLocaleString()
    };

    firebase.database().ref(`dpps/${uploadClass}/${newId}`).set(newDPP).then(() => {
      setMessage("✅ DPP successfully uploaded!");
      setUploadTitle("");
      setUploadQuestions("0");
      setTimeout(() => setMessage(""), 3000);
    }).catch(err => {
      setMessage(`❌ Error: ${err.message}`);
    });
  };

  const handleDeleteDPP = (dppKey, classKey) => {
    if(confirm("Delete करना है? 🗑️")) {
      firebase.database().ref(`dpps/${classKey}/${dppKey}`).remove();
      setMessage("✅ DPP deleted!");
      setTimeout(() => setMessage(""), 2000);
    }
  };

  const groupedDPPs = {
    class10: dpps.filter(d => d.batch === 'class10'),
    class8: dpps.filter(d => d.batch === 'class8'),
    class7: dpps.filter(d => d.batch === 'class7'),
  };

  return (
    <div className="container">
      <div className="teacher-panel">
        <div className="panel-header">
          <h2>👨‍🏫 Teacher Control Panel</h2>
          <button className="logout-btn" onClick={onLogout}>Logout</button>
        </div>

        {message && <div className={`message ${message.includes('Error') ? 'error' : 'success'}`}>{message}</div>}

        <div className="stats-grid">
          <div className="stat-box">
            <div className="number">{dppStats.total}</div>
            <div className="label">Total DPPs</div>
          </div>
          <div className="stat-box">
            <div className="number">{dppStats.class10}</div>
            <div className="label">Class 10</div>
          </div>
          <div className="stat-box">
            <div className="number">{dppStats.class8}</div>
            <div className="label">Class 8</div>
          </div>
          <div className="stat-box">
            <div className="number">{dppStats.class7}</div>
            <div className="label">Class 7</div>
          </div>
        </div>

        <div style={{marginBottom:'40px'}}>
          <h3 style={{marginBottom:'20px', fontSize:'1.3rem', color:'var(--accent3)'}}>📁 Class Folders</h3>
          <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(200px, 1fr))', gap:'20px'}}>
            <div style={{padding:'20px', background:'linear-gradient(135deg,var(--surface2),var(--surface))', border:'2px solid var(--border)', borderRadius:'16px', cursor:'pointer', textAlign:'center', transition:'all .3s'}}>
              <div style={{fontSize:'3rem', marginBottom:'12px'}}>📘</div>
              <div style={{fontSize:'1.2rem', fontWeight:'700', color:'var(--accent3)', marginBottom:'8px'}}>Class 10</div>
              <div style={{fontSize:'.9rem', color:'var(--muted)'}}>{dppStats.class10} DPPs</div>
            </div>
            <div style={{padding:'20px', background:'linear-gradient(135deg,var(--surface2),var(--surface))', border:'2px solid var(--border)', borderRadius:'16px', cursor:'pointer', textAlign:'center', transition:'all .3s'}}>
              <div style={{fontSize:'3rem', marginBottom:'12px'}}>📙</div>
              <div style={{fontSize:'1.2rem', fontWeight:'700', color:'var(--accent3)', marginBottom:'8px'}}>Class 8</div>
              <div style={{fontSize:'.9rem', color:'var(--muted)'}}>{dppStats.class8} DPPs</div>
            </div>
            <div style={{padding:'20px', background:'linear-gradient(135deg,var(--surface2),var(--surface))', border:'2px solid var(--border)', borderRadius:'16px', cursor:'pointer', textAlign:'center', transition:'all .3s'}}>
              <div style={{fontSize:'3rem', marginBottom:'12px'}}>📕</div>
              <div style={{fontSize:'1.2rem', fontWeight:'700', color:'var(--accent3)', marginBottom:'8px'}}>Class 7</div>
              <div style={{fontSize:'.9rem', color:'var(--muted)'}}>{dppStats.class7} DPPs</div>
            </div>
          </div>
        </div>

        <div className="upload-section">
          <h3>➕ नया DPP Upload करो</h3>
          <div className="upload-controls">
            <select value={uploadClass} onChange={(e) => setUploadClass(e.target.value)}>
              <option value="class7">📕 Class 7</option>
              <option value="class8">📙 Class 8</option>
              <option value="class10">📘 Class 10</option>
            </select>
            <input type="text" placeholder="DPP Title" value={uploadTitle} onChange={(e) => setUploadTitle(e.target.value)}/>
            <input type="number" placeholder="Questions count" min="0" value={uploadQuestions} onChange={(e) => setUploadQuestions(e.target.value)}/>
            <button onClick={handleUploadDPP}>Upload ✅</button>
          </div>
        </div>

        <div className="class-management">
          <h3>📋 सभी DPPs Manage करो</h3>
          {Object.entries(groupedDPPs).map(([classKey, classDPPs]) => (
            <div key={classKey} style={{marginBottom:'30px'}}>
              <h4 style={{color:'var(--accent3)',marginBottom:'15px',fontSize:'1.1rem'}}>
                {classKey === 'class10' ? '📘 Class 10' : classKey === 'class8' ? '📙 Class 8' : '📕 Class 7'}
                <span style={{color:'var(--muted)',fontSize:'.9rem',marginLeft:'10px'}}>({classDPPs.length})</span>
              </h4>
              {classDPPs.length > 0 ? (
                <div className="dpp-list">
                  {classDPPs.map((dpp) => (
                    <div key={dpp.key} className="dpp-item">
                      <div className="dpp-item-info">
                        <div className="dpp-item-title">{dpp.title}</div>
                        <div className="dpp-item-meta">📝 {dpp.questions?.length || 0} Questions | ID: {dpp.id}</div>
                      </div>
                      <button className="delete-btn" onClick={() => handleDeleteDPP(dpp.key, classKey)}>Delete</button>
                    </div>
                  ))}
                </div>
              ) : (
                <div style={{textAlign:'center',padding:'20px',color:'var(--muted)'}}>अभी कोई DPP नहीं</div>
              )}
            </div>
          ))}
        </div>

        <div className="class-management" style={{marginTop:'50px',paddingTop:'30px',borderTop:'2px solid var(--border)'}}>
          <h3>🔍 सभी Classes की सभी DPPs</h3>
          {dpps.length > 0 ? (
            <div className="dpp-list">
              {dpps.map((dpp) => (
                <div key={dpp.key} className="dpp-item">
                  <div className="dpp-item-info">
                    <div className="dpp-item-title">{dpp.title}</div>
                    <div className="dpp-item-meta">
                      {dpp.batch === 'class10' ? '📘 Class 10' : dpp.batch === 'class8' ? '📙 Class 8' : '📕 Class 7'} 
                      &nbsp;|&nbsp;📝 {dpp.questions?.length || 0} Questions | ID: {dpp.id}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          ) : (
            <div style={{textAlign:'center',padding:'20px',color:'var(--muted)'}}>कोई DPP नहीं</div>
          )}
        </div>
      </div>
    </div>
  );
}

// ════════ STUDENT VIEW ════════
function StudentView({onTeacherRequest}){
  const [dpps, setDpps] = React.useState([]);
  const [selectedClass, setSelectedClass] = React.useState("class10");

  React.useEffect(() => {
    const classes = ["class7", "class8", "class10"];
    classes.forEach(classKey => {
      const ref = firebase.database().ref(`dpps/${classKey}`);
      ref.on('value', (snap) => {
        const data = snap.val() || {};
        const dppsArray = Object.values(data);
        setDpps(prev => {
          const filtered = prev.filter(d => d.batch !== classKey);
          return [...filtered, ...dppsArray];
        });
      });
    });
  }, []);

  const groupedDPPs = {
    class10: dpps.filter(d => d.batch === 'class10'),
    class8: dpps.filter(d => d.batch === 'class8'),
    class7: dpps.filter(d => d.batch === 'class7'),
  };

  const currentDPPs = groupedDPPs[selectedClass];

  return (
    <div className="container">
      <div className="student-header">
        <h1>📚 Sameer Sir Maths DPP</h1>
        <p style={{color:'var(--muted)', marginTop:'10px'}}>अपना class select करो 👇</p>
      </div>

      <div className="class-tabs">
        {[{key:'class7', label:'📕 Class 7'}, {key:'class8', label:'📙 Class 8'}, {key:'class10', label:'📘 Class 10'}].map(cls => (
          <button key={cls.key} className={`tab-btn ${selectedClass === cls.key ? 'active' : ''}`} onClick={() => setSelectedClass(cls.key)}>
            {cls.label}
          </button>
        ))}
      </div>

      <div className="dpps-grid">
        {currentDPPs.length > 0 ? (
          currentDPPs.map((dpp, idx) => (
            <div key={idx} className="dpp-card">
              <div className="dpp-title">{dpp.title}</div>
              <div className="dpp-info">
                <div>📝 {dpp.questions?.length || 0} Questions</div>
                <div>⭐ {dpp.questions?.length || 0} Marks</div>
              </div>
              <div className="dpp-date">{dpp.id}</div>
            </div>
          ))
        ) : (
          <div className="empty-state"><p>😴 इस class में कोई DPP नहीं है</p></div>
        )}
      </div>

      <div className="teacher-hint" onClick={onTeacherRequest}>
        🔐 Teacher Login (Ctrl+Shift+T)
      </div>
    </div>
  );
}

// ════════ MAIN APP ════════
function App(){
  const [isTeacher, setIsTeacher] = React.useState(false);
  const [passwordInput, setPasswordInput] = React.useState("");
  const [passwordError, setPasswordError] = React.useState("");

  React.useEffect(() => {
    const handleKeyPress = (e) => {
      if(e.ctrlKey && e.shiftKey && e.key === 'T') {
        setIsTeacher(true);
      }
    };
    window.addEventListener('keydown', handleKeyPress);
    return () => window.removeEventListener('keydown', handleKeyPress);
  }, []);

  const handleTeacherLogin = () => {
    if(passwordInput === TEACHER_PASSWORD) {
      setIsTeacher(true);
      setPasswordInput("");
      setPasswordError("");
    } else {
      setPasswordError("❌ Galat password!");
      setPasswordInput("");
    }
  };

  if(isTeacher && !passwordInput) {
    return <TeacherPanel onLogout={() => setIsTeacher(false)} />;
  }

  if(isTeacher && passwordInput === "") {
    return (
      <div className="login-screen">
        <div className="login-card">
          <h1>🔐 Teacher Panel</h1>
          <p>अपना password enter करो</p>
          {passwordError && <div className="error-msg">{passwordError}</div>}
          <input className="login-input" type="password" placeholder="Password" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleTeacherLogin()}/>
          <button className="login-btn" onClick={handleTeacherLogin}>Login करो 🚀</button>
        </div>
      </div>
    );
  }

  return <StudentView onTeacherRequest={() => setIsTeacher(true)} />;
}

ReactDOM.render(<App />, document.getElementById('root'));

// Seed initial DPPs
window.addEventListener("load", function(){
  setTimeout(() => {
    const sampleDPPs = [
      {id:"C10CH8DPP1",title:"Trigonometry chapter-8,9",batch:"class10",questions:[{text:"Test",type:"mcq",options:[],answer:"",marks:"1"}]},
      {id:"C7CH1DPP1",title:"Large Numbers – DPP 1",batch:"class7",questions:[{text:"Test",type:"mcq",options:[],answer:"",marks:"1"}]},
    ];

    sampleDPPs.forEach(dpp => {
      firebase.database().ref(`dpps/${dpp.batch}/${dpp.id}`).once('value', snap => {
        if(!snap.val()) {
          firebase.database().ref(`dpps/${dpp.batch}/${dpp.id}`).set(dpp);
        }
      });
    });
  }, 2000);
});
</script>
</body>
</html>
